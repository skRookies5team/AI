name: CD (ECR + SSM)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1️⃣ OIDC로 AWS 자격증명 설정
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 2️⃣ ECR 로그인
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 3️⃣ Docker 이미지 빌드 & 푸시
      - name: Build & Push image
        env:
          IMAGE: ${{ secrets.ECR_REPOSITORY_URI }}
        run: |
          set -e
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # 4️⃣ SSM으로 EC2 배포
      - name: Deploy on EC2 via SSM (docker compose)
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE: ${{ secrets.ECR_REPOSITORY_URI }}
          TAG: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SERVICE_DIR: /opt/ai/app
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $GITHUB_SHA" \
            --query "Command.CommandId" \
            --output text \
            --parameters commands="[
              \"sudo mkdir -p $SERVICE_DIR\",
              \"sudo touch $SERVICE_DIR/.env\",
              \"sudo sh -c 'echo IMAGE=$IMAGE >  $SERVICE_DIR/.env'\",
              \"sudo sh -c 'echo TAG=$TAG   >> $SERVICE_DIR/.env'\",
              \"aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $(echo $IMAGE | cut -d/ -f1)\",
              \"docker compose -f $SERVICE_DIR/docker-compose.yml down\",
              \"docker compose -f $SERVICE_DIR/docker-compose.yml pull\",
              \"docker compose -f $SERVICE_DIR/docker-compose.yml up -d --remove-orphans\",
              \"sudo docker image prune -f\"
            ]")

          echo "SSM CommandId: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "---- STDOUT ----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text || true

          echo "---- STDERR ----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text || true

          echo "---- STATUS ----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode}" \
            --output json || true
