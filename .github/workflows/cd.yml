name: CD (ECR + SSM)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push image
        env:
          IMAGE: ${{ secrets.ECR_REPOSITORY_URI }}
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy on EC2 via SSM (docker compose)
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE: ${{ secrets.ECR_REPOSITORY_URI }}
          TAG: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SERVICE_DIR: /opt/ai/app
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $GITHUB_SHA" \
            --query "Command.CommandId" \
            --output text \
            --parameters commands="[
              \"set -euo pipefail\",
              \"sudo mkdir -p $SERVICE_DIR\",
              \"cd $SERVICE_DIR\",
              \"echo IMAGE=$IMAGE | sudo tee .env > /dev/null\",
              \"echo TAG=$TAG | sudo tee -a .env > /dev/null\",
              \"aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $(echo $IMAGE | cut -d/ -f1)\",
              \"sudo docker compose pull\",
              \"sudo docker compose up -d --remove-orphans\",
              \"sudo docker image prune -f\"
            ]")

          echo "SSM CommandId: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text