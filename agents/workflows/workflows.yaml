workflows:
  - name: "business_trip"
    description: "출장 신청 및 관리 워크플로우"
    detection_prompt: |
      사용자가 "출장", "워크샵", "세미나", "학회" 등을 위해 "신청", "다녀올게", "갈게", "가야해" 등의 의도로
      일정 등록, 문서 작성, 이메일 발송 등의 일련의 과정을 요청하는 경우입니다.
      단순한 일정 조회는 제외합니다.

    # LLM이 판단하기 위한 키워드 (보조용)
    detection_keywords: ["출장", "워크샵", "세미나", "학회", "교육"]

    steps:
      - step_name: "schedule_check"
        domain: "schedule"
        description: "일정 조회 및 날짜 확인"
        intent: "check_schedule"
        action: "check_schedule_conflicts"
        required_data: ["start_date", "end_date", "location", "purpose"]
        human_in_loop:
            required: true
            description: "사용자에게 감지된 날짜와 일정이 맞는지 확인하고, 문서 작성을 진행할지 물어봅니다."
            actions: ["proceed", "cancel"]
            
      - step_name: "document_creation"
        domain: "document"
        description: "출장 신청서 문서 작성 및 결재"
        intent: "create_document"
        action: "generate_business_trip_form"
        required_data: ["start_date", "end_date", "location", "purpose", "employee_id"]
        output_data: ["document_path", "document_content"]
        human_in_loop:
            required: true
            description: "생성된 문서를 보여주고 결재를 진행할지 물어봅니다."
            actions: ["proceed", "cancel"]

      - step_name: "register_and_email"
        domain: "email" 
        description: "일정 등록 및 이메일 발송 (완료)"
        intent: "send_email"
        action: "register_calendar_and_send_email"
        required_data: ["start_date", "end_date", "location", "purpose", "document_path"]
        output_data: ["email_draft", "calendar_event"]
        human_in_loop:
            required: true
            description: "최종 처리 결과를 보여주고 확인을 받습니다."
            actions: ["confirm"]
