# 워크플로우 메타데이터 설정 파일
# Python 코드의 기본값을 오버라이드하며, 런타임에 동적으로 변경 가능
# 30개 이상의 워크플로우를 체계적으로 관리

version: '1.0'
comment: '워크플로우 메타데이터 설정 파일 - 하이브리드 방식 (Python 기본값 + YAML 오버라이드)'

workflows:
  # ==================== 출장/휴가 관리 ====================
  business_trip_flow:
    category: travel
    description: "출장/휴가 관리 서비스 (일정 조회 + 문서 작성 + 부재중 이메일 + 팀 알림)"
    priority: 10
    enabled: true
    examples:
      - "다음주 3일간 제주도로 워크샵 다녀올게"
      - "12월 1일부터 3일간 서울 출장 등록"
      - "휴가 신청해줘"

  vacation_return_briefing_flow:
    category: travel
    description: "휴가 복귀 브리핑 (중요 메일 필터링 + 놓친 회의 확인 + To-Do 리스트 생성)"
    priority: 8
    enabled: true
    examples:
      - "일주일 휴가 다녀왔어. 놓친 중요 업무 브리핑해줘"
      - "복귀 후 해야 할 일 정리해줘"

  expense_report_flow:
    category: finance
    description: "법인카드 사용 내역 소명 및 지출결의서 작성"
    priority: 7
    enabled: true
    examples:
      - "지난주 부산 출장 때 쓴 법인카드 내역 지출결의서 올려줘"
      - "야근 식대 청구서 작성해줘"

  # ==================== R&D/기술 ====================
  research_flow:
    category: research
    description: "R&D 인사이트 및 리포트 자동화 (특허/논문 검색 + 벡터 DB 저장 + 리포트 생성 + 공유)"
    priority: 10
    enabled: true
    examples:
      - "생성형 AI 최신 특허 동향 조사해줘"
      - "R&D 리포트 작성"
      - "기술 동향 분석해줘"

  competitor_analysis_flow:
    category: research
    description: "경쟁사 동향 모니터링 및 분석 보고서 작성"
    priority: 9
    enabled: true
    examples:
      - "요즘 경쟁사 B가 내놓은 신제품 기술이랑 시장 반응 보고해줘"
      - "경쟁사 동향 분석해줘"

  patent_infringement_flow:
    category: legal
    description: "특허 침해 경고 대응 분석 (특허 분석 + 방어 논리 찾기 + 대응 보고서)"
    priority: 8
    enabled: true
    examples:
      - "D사에서 특허 침해 경고장 왔는데, 해당 특허 분석하고 대응 논리 찾아봐"
      - "특허 침해 대응 논리 작성해줘"

  seminar_summary_flow:
    category: research
    description: "세미나/컨퍼런스 요약 및 팀 공유"
    priority: 7
    enabled: true
    examples:
      - "어제 CES 2025 관련 기사나 리포트 찾아서 우리 팀에 도움 될만한 거 요약해줘"
      - "컨퍼런스 요약 공유해줘"

  newsletter_curation_flow:
    category: marketing
    description: "뉴스레터 콘텐츠 큐레이션 및 발송"
    priority: 6
    enabled: true
    examples:
      - "이번 주 IT 트렌드 뉴스 모아서 고객 발송용 뉴스레터 초안 만들어"
      - "뉴스레터 작성해줘"

  # ==================== 회의 준비 ====================
  meeting_flow:
    category: meeting
    description: "스마트 회의 준비 비서 (회의실 예약 + 자료 준비 + 초대장 발송 + 간식 추천)"
    priority: 10
    enabled: true
    examples:
      - "다음 주 월요일 오후 2시에 신규 프로젝트 킥오프 회의 잡아줘"
      - "회의 설정해줘"

  customer_meeting_prep_flow:
    category: sales
    description: "고객사 미팅 완벽 대비 (이력 검색 + 기술 동향 파악 + 브리핑 리포트 + 이동 시간 확보)"
    priority: 9
    enabled: true
    examples:
      - "다음 주 화요일 삼성전자 미팅 전까지 관련 자료 브리핑해줘"
      - "고객 미팅 준비 자료 만들어줘"

  interview_scheduling_flow:
    category: hr
    description: "면접 일정 조율 및 준비 (면접관 캘린더 조율 + 이력서/평가표 생성 + 질문지 생성 + 발송)"
    priority: 8
    enabled: true
    examples:
      - "김철수 지원자 1차 면접 잡고, 면접관들에게 이력서랑 질문지 보내줘"
      - "면접 일정 잡아줘"

  contract_renewal_flow:
    category: sales
    description: "계약 만료 알림 및 갱신 준비 (계약 조회 + 갱신 계약서 작성 + 미팅 일정 등록)"
    priority: 7
    enabled: true
    examples:
      - "A사 유지보수 계약 언제 끝나는지 확인하고, 갱신 계약서 초안 잡아줘"
      - "계약 갱신 준비해줘"

  rfp_analysis_flow:
    category: sales
    description: "RFP 분석 및 제안서 초안 구성"
    priority: 7
    enabled: true
    examples:
      - "이번에 뜬 공공기관 AI 사업 RFP 분석해서 우리 기술로 가능한지 봐줘"
      - "RFP 분석해줘"

  project_retrospective_flow:
    category: project
    description: "프로젝트 회고 준비 (이슈 정리 + KPT 템플릿 작성)"
    priority: 6
    enabled: true
    examples:
      - "이번 프로젝트 종료 회고록 작성하게 지난 3개월 이슈 정리해줘"
      - "프로젝트 회고 준비해줘"

  meeting_transcription_flow:
    category: meeting
    description: "회의 녹취록 자동 작성 및 요약"
    priority: 6
    enabled: true
    examples:
      - "방금 끝난 회의 녹음 파일 줄 테니까 회의록 써서 참석자한테 뿌려"
      - "회의록 작성해줘"

  # ==================== HR/인사 ====================
  onboarding_automation_flow:
    category: hr
    description: "신규 입사자 온보딩 자동화 (규정 조회 + 보안 서약서 생성 + OJT 일정 등록 + 환영 메일)"
    priority: 9
    enabled: true
    examples:
      - "내일 새로 오는 김신입 사원 온보딩 준비해줘"
      - "신입사원 온보딩 준비해줘"

  mandatory_training_flow:
    category: hr
    description: "사내 교육(법정 의무 교육) 독려 및 알림"
    priority: 6
    enabled: true
    examples:
      - "아직 성희롱 예방 교육 안 들은 사람들 추려서 독촉 메일 보내"
      - "교육 미이수자 독촉해줘"

  business_card_request_flow:
    category: hr
    description: "명함 신청 자동화"
    priority: 5
    enabled: true
    examples:
      - "나 진급했어. 명함 새로 파줘"
      - "명함 신청해줘"

  handover_document_flow:
    category: hr
    description: "업무 인수인계서 작성"
    priority: 6
    enabled: true
    examples:
      - "나 다음 주부터 다른 팀 가니까, 지금 하는 업무 인수인계서 좀 써줘"
      - "인수인계서 작성해줘"

  birthday_congratulations_flow:
    category: hr
    description: "생일자 축하 및 선물 지급"
    priority: 5
    enabled: true
    examples:
      - "이번 달 생일인 직원들 찾아서 축하 메일 보내고, 기프티콘 발송 품의 올려"
      - "생일 축하 메일 보내줘"

  # ==================== 문서/보고서 ====================
  monthly_report_flow:
    category: document
    description: "월간 업무 성과 보고서 자동 생성 (활동 분석 + 성과 추출 + 보고서 작성 + 결재 준비)"
    priority: 8
    enabled: true
    examples:
      - "이번 달 내 업무 성과 정리해서 보고서 초안 써줘"
      - "월간 보고서 작성해줘"

  survey_creation_flow:
    category: document
    description: "사내 설문조사 생성 및 분석"
    priority: 6
    enabled: true
    examples:
      - "이번 워크샵 장소 어디가 좋을지 전사 설문 돌리고 결과 요약해줘"
      - "설문조사 만들어줘"

  # ==================== 복리후생 ====================
  benefit_recommendation_flow:
    category: benefit
    description: "복리후생 맞춤형 추천 및 신청 (규정 조회 + 일정 추천 + 신청 연동)"
    priority: 7
    enabled: true
    examples:
      - "나 건강검진 아직 안 받았는데, 언제 받을 수 있고 어떻게 신청해?"
      - "복리후생 신청해줘"

  weekly_menu_announcement_flow:
    category: menu
    description: "주간 식단 공지 및 투표"
    priority: 5
    enabled: true
    examples:
      - "다음 주 구내식당 메뉴 알려주고, 특식 메뉴 투표 받아봐"
      - "주간 식단 투표해줘"

  lunch_decision_flow:
    category: menu
    description: "점심 메뉴 결정 장애 해결사 (상황 인지 + 식단 조회 + 일정 확인 + 추천)"
    priority: 6
    enabled: true
    examples:
      - "오늘 비 오는데 점심 뭐 먹지? 오후에 졸리면 안 되는데..."
      - "오늘 점심 추천해줘"

  # ==================== 일반/행사 ====================
  event_planning_flow:
    category: general
    description: "사내 해커톤/행사 기획 (행사 이력 조회 + 회의실 예약 + 기획안 작성 + 공지)"
    priority: 7
    enabled: true
    examples:
      - "다음 달 사내 해커톤 행사 기획안 짜고 전사 공지해줘"
      - "행사 기획해줘"

  server_maintenance_flow:
    category: infrastructure
    description: "서버 정기 점검 공지 및 엔지니어 대기"
    priority: 7
    enabled: true
    examples:
      - "이번 주 목요일 새벽 2시에 정기 점검한다고 공지하고 엔지니어들 대기시켜"
      - "서버 점검 공지해줘"

  vip_preparation_flow:
    category: general
    description: "VIP 의전 준비 (일정 점검 + 메뉴 추천 + 의전 시나리오 작성)"
    priority: 6
    enabled: true
    examples:
      - "내일 모레 E사 회장님 방문하시는데 의전 시나리오 짜줘"
      - "VIP 방문 준비해줘"

  overseas_buyer_flow:
    category: sales
    description: "해외 바이어 영문 응대 (제품 소개서 번역 + 시차 고려 일정 조율 + 영문 메일 작성)"
    priority: 6
    enabled: true
    examples:
      - "미국 바이어한테 제품 소개서 보내주고, 다음 주 줌 미팅 가능한지 물어봐"
      - "해외 바이어 응대해줘"

# 카테고리별 기본 설정
categories:
  travel:
    priority: 10
    description: "출장/휴가 관련 워크플로우"
  research:
    priority: 9
    description: "R&D/기술 연구 관련 워크플로우"
  meeting:
    priority: 10
    description: "회의 준비 관련 워크플로우"
  hr:
    priority: 8
    description: "인사/HR 관련 워크플로우"
  sales:
    priority: 8
    description: "영업 관련 워크플로우"
  finance:
    priority: 7
    description: "회계/재무 관련 워크플로우"
  legal:
    priority: 8
    description: "법무/계약 관련 워크플로우"
  document:
    priority: 7
    description: "문서 작성 관련 워크플로우"
  benefit:
    priority: 6
    description: "복리후생 관련 워크플로우"
  menu:
    priority: 5
    description: "식단/메뉴 관련 워크플로우"
  general:
    priority: 5
    description: "일반 업무 관련 워크플로우"
  infrastructure:
    priority: 7
    description: "인프라/IT 관련 워크플로우"
  project:
    priority: 7
    description: "프로젝트 관리 관련 워크플로우"
  marketing:
    priority: 6
    description: "마케팅 관련 워크플로우"

