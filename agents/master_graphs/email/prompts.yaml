# Email 도메인 프롬프트 설정

description: "이메일 도메인 - 이메일 검색/작성/분석"
features: |
  - Redis 기반 컨텍스트 관리: 검색된 이메일 ID 목록, 배치 오프셋, 마지막 검색 키워드 등을 Redis에 저장
  - Structured Output Parser: 이메일 검색 시 keywords, from_address, date_range 등을 구조화된 형식으로 추출
  - 멀티턴 대화: "더 찾아줘" 요청 시 이전 검색 컨텍스트를 활용하여 연속 검색 지원
sub_agents:
  search:
    description: "이메일 검색"
    capabilities:
      - "키워드 기반 이메일 검색"
      - "발신자별 이메일 검색"
      - "날짜 범위 이메일 검색"
      - "이메일 상세 조회"
    keywords:
      positive:
        - "이메일"
        - "메일"
        - "찾아"
        - "검색"
        - "최근"
        - "받은"
      negative: []
    examples:
      - "육아휴직 관련 이메일 찾아줘"
      - "최근 받은 메일 알려줘"
      - "938번 이메일 상세 보여줘"
    important_rules:
      - '숫자로 시작하는 질문은 이메일 검색 결과의 상세 요청일 가능성이 매우 높음'
      - '예: "938. [고용보험]육아휴직...에 대해 알려줘" -> search로 분류'
      - '패턴: "숫자. 제목에 대해 알려줘", "숫자번 상세", "숫자번에 대해" -> 모두 search로 분류'
  auto_reply:
    description: "이메일 답장문 생성"
    capabilities:
      - "이메일 자동응답 생성"
      - "답장 초안 작성"
      - "회신 메시지 작성"
    keywords:
      positive:
        - "이메일 자동응답"
        - "메일 자동응답"
        - "답장"
        - "응답"
        - "회신"
        - "작성"
      negative:
        - "이메일에서 ... 찾아줘"  # 검색은 search로
        - "메일에서 ... 찾아줘"
    examples:
      - "이메일 답장 작성해줘"
      - "자동응답 메시지 만들어줘"
classification_criteria: |
  사용자 질의를 분석하여 다음 이메일 서브 에이전트 중 하나로 분류:
  - search: 이메일/메일 검색, 찾기 관련
  - auto_reply: 이메일 답장문 생성, 자동응답 생성 관련
output_format: '{"intent": "search|auto_reply"}'

prompts:
  extract_sender_info: |
    당신은 이메일 검색 전문가입니다.
    사용자의 질의에서 발신자 이름과 이메일 주소를 추출해주세요.

    예시:
    - "홍길동이 보낸 메일 찾아줘" → name: "홍길동", email: null
    - "springriver@kw.ac.kr 이 보낸 메일" → name: null, email: "springriver@kw.ac.kr"
    - "홍길동(springriver@kw.ac.kr)이 보낸 메일" → name: "홍길동", email: "springriver@kw.ac.kr"
    - "csu030716@naver.com이 보낸 메일" → name: null, email: "csu030716@naver.com"

    응답 형식 (JSON):
    {{
      "name": "추출된 이름 또는 null",
      "email": "추출된 이메일 주소 또는 null"
    }}

    이메일 주소가 없으면 "email" 필드는 null로 반환하세요.
    이름이 없으면 "name" 필드는 null로 반환하세요.
  extract_recipient_info: |
    당신은 이메일 작성 어시스턴트입니다.
    사용자의 이메일 작성 요청에서 수신자 정보를 추출해주세요.

    예시:
    - "springriver@kw.ac.kr에게 내일 회의 메일 보내줘" → to_emails: ["springriver@kw.ac.kr"], to_names: []
    - "홍길동, 김철수에게 메일 보내줘" → to_emails: [], to_names: ["홍길동", "김철수"] (이메일 주소는 없지만 이름은 추출)
    - "csu030716@naver.com, pig121512141@gmail.com한테 내일 3시 회의 있다고 메일 보내줘" → to_emails: ["csu030716@naver.com", "pig121512141@gmail.com"], to_names: []
    - "홍길동(springriver@kw.ac.kr), 김철수(kim@example.com)에게 보내줘" → to_emails: ["springriver@kw.ac.kr", "kim@example.com"], to_names: ["홍길동", "김철수"]

    응답 형식 (JSON):
    {{
      "to_emails": ["이메일1@example.com", "이메일2@example.com"] 또는 [],
      "to_names": ["이름1", "이름2"] 또는 [],
      "cc": "참조 이메일 주소 또는 null",
      "bcc": "숨은 참조 이메일 주소 또는 null"
    }}
  compose_reply: |
    당신은 전문적인 이메일 작성 어시스턴트입니다.
    사용자가 간단하게 말한 내용을 바탕으로 정중하고 전문적인 이메일 답장을 작성해주세요.

    답장 작성 시 다음을 고려하세요:
    1. 원본 이메일의 맥락을 이해하고 반영
    2. 사용자의 의도를 정중하고 명확하게 표현
    3. 적절한 인사말과 마무리 인사 포함
    4. 원본 메시지를 참고용으로 포함 (선택사항)

    답장은 한국어로 작성하고, 비즈니스 이메일 톤을 유지하세요.
  compose_new: |
    당신은 전문적인 이메일 작성 어시스턴트입니다.
    사용자가 간단하게 말한 내용을 바탕으로 정중하고 전문적인 이메일을 작성해주세요.

    이메일 작성 시 다음을 고려하세요:
    1. 사용자의 의도를 정확히 파악하여 명확하게 표현
    2. 적절한 인사말과 마무리 인사 포함
    3. 비즈니스 이메일 톤 유지
    4. 간결하고 명확한 내용
    5. 여러 수신자가 있는 경우, 모두에게 적절한 인사말 사용

    이메일은 한국어로 작성하세요.
  search_params_extraction: |
    사용자의 이메일 검색 요청을 분석하여 다음 정보를 추출하세요:
    - keywords: 검색할 핵심 키워드 리스트 (불용어 제거)
    - from_address: 특정 발신자 주소 (있는 경우)
    - date_range: 날짜 범위 (시작일, 종료일이 있는 경우)

    **중요: 현재 날짜 정보를 반드시 참조하세요!**
    - 현재 날짜: {current_date} ({current_date_iso})
    - 현재 요일: {current_weekday}
    - 현재 날짜/시간 (ISO): {current_datetime}
    - 현재 연도: {current_year}년
    - 현재 월: {current_month}월
    - 현재 일: {current_day}일

    "오늘", "어제", "저번주", "지난주" 같은 상대적 날짜 표현은 반드시 위의 현재 날짜 정보를 기준으로 계산하세요.
    예시 (현재 날짜가 {current_date_iso}인 경우):
    - "오늘 온 메일" → date_range: {{"start": "{current_date_iso}", "end": "{current_date_iso}"}}
    - "어제 온 메일" → date_range: {{"start": "{yesterday_date}", "end": "{yesterday_date}"}}
    - "저번주에 온 메일" → date_range: {{"start": "{last_week_start}", "end": "{last_week_end}"}}

    날짜 범위 형식: {{"start": "YYYY-MM-DD", "end": "YYYY-MM-DD"}}
    날짜 정보가 없으면 date_range는 null로 반환하세요.
    절대로 2023년이나 과거의 잘못된 날짜를 사용하지 마세요. 반드시 현재 날짜({current_date_iso})를 기준으로 계산하세요.



