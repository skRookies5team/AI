stopwords:
  # 날짜/수신 관련 자주 등장하지만 검색 키워드가 아닌 단어들
  - "오늘"
  - "어제"
  - "온"
  - "받은"
  - "메일"
  - "이메일"
  - "보여줘"
  - "보여"
  - "알려줘"
  - "알려"
  - "찾아줘"
  - "찾아"
  - "검색"
  - "요약"
  - "자세히"
  - "상세"
  - "보기"

# few-shot 예시: LLM이 원하는 출력 형태를 학습하도록
few_shot_examples:
  - input: "어제 온 메일 알려줘"
    output:
      keywords: []
      from_address: null
      date_range: { start: "{yesterday_date}", end: "{yesterday_date}" }

  - input: "오늘 온 메일 알려줘"
    output:
      keywords: []
      from_address: null
      date_range: { start: "{current_date_iso}", end: "{current_date_iso}" }

  - input: "어제 hong12@gmail.com 온 메일 알려줘"
    output:
      keywords: []
      from_address: "hong12@gmail.com"
      date_range: { start: "{yesterday_date}", end: "{yesterday_date}" }

system_prompt_template: |
  사용자의 이메일 검색 요청을 분석하여 다음 정보를 추출하세요:
  - keywords: 검색할 핵심 키워드 리스트 (불용어 제거)
  - from_address: 특정 발신자 주소 (있는 경우)
  - date_range: 날짜 범위 (시작일, 종료일이 있는 경우)

  중요 규칙:
  - "오늘/어제/온/받은/메일/이메일"은 keywords가 아닙니다. keywords에는 넣지 마세요.
  - keywords에는 주제 단어만 남기세요. (예: "육아휴직", "견적", "계약서")

  현재 날짜 정보(반드시 참조):
  - current_date_iso: {current_date_iso}
  - yesterday_date: {yesterday_date}
  - last_week_start: {last_week_start}
  - last_week_end: {last_week_end}

  few-shot 예시:
  {few_shots}

  이제 다음 사용자 입력을 파싱하세요.

