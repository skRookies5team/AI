# Email search parameter extraction (LLM Structured Output) config
#
# This file is used by EmailMasterGraph.search_email() to build the system prompt
# for EmailSearchParams extraction.
#
# Notes
# - Keep examples compact: they are sent to the LLM on every call.
# - Use token placeholders instead of `{}` to avoid Python .format() collisions.
#   Available tokens:
#     __CURRENT_DATE__           (e.g. "2025년 12월 19일")
#     __CURRENT_DATE_ISO__       (e.g. "2025-12-19")
#     __CURRENT_WEEKDAY__        (e.g. "금요일")
#     __CURRENT_DATETIME_ISO__   (e.g. "2025-12-19T10:11:12+09:00" or naive)
#     __YESTERDAY_ISO__          (e.g. "2025-12-18")
#     __LAST_WEEK_START_ISO__    (e.g. "2025-12-08")  # Mon
#     __LAST_WEEK_END_ISO__      (e.g. "2025-12-14")  # Sun
version: 1

system_prompt_template: |
  사용자의 이메일 검색 요청을 분석하여 다음 정보를 추출하세요:
  - keywords: 검색할 핵심 키워드 리스트 (불용어 제거, 의미 없는 단어 제거)
  - from_address: 특정 발신자 이메일 주소 (있는 경우)
  - date_range: 날짜 범위 (시작일, 종료일이 있는 경우)

  **중요: 현재 날짜 정보를 반드시 참조하세요!**
  - 현재 날짜: __CURRENT_DATE__ (__CURRENT_DATE_ISO__)
  - 현재 요일: __CURRENT_WEEKDAY__
  - 현재 날짜/시간 (ISO): __CURRENT_DATETIME_ISO__

  상대 날짜 표현 규칙:
  - "오늘" → date_range.start/end = __CURRENT_DATE_ISO__
  - "어제" → date_range.start/end = __YESTERDAY_ISO__
  - "저번주/지난주" → date_range = {start: __LAST_WEEK_START_ISO__, end: __LAST_WEEK_END_ISO__}

  keywords 규칙:
  - "오늘", "온", "메일", "이메일", "보여줘", "알려줘", "찾아줘" 같은 불용어는 keywords에 절대 넣지 마세요.
  - 날짜만 지정된 요청("오늘 온 메일 보여줘")은 keywords=[] 가 맞습니다.
  - keywords는 2글자 이상(또는 의미 있는 영문/숫자 조합)만 포함하세요.
  - 확실한 주제 키워드(예: "육아휴직", "결재", "견적", "회의")가 있으면 그것만 keywords로 추출하세요.

  출력은 반드시 EmailSearchParams 스키마에 맞춰 반환하세요.

few_shot_examples:
  - input: "오늘 온 메일 보여줘"
    output:
      keywords: []
      from_address: null
      date_range: { start: "__CURRENT_DATE_ISO__", end: "__CURRENT_DATE_ISO__" }
  - input: "어제 온 메일 보여줘"
    output:
      keywords: []
      from_address: null
      date_range: { start: "__YESTERDAY_ISO__", end: "__YESTERDAY_ISO__" }
  - input: "a000@qwer.com 한테 어제 온 메일 보여줘"
    output:
      keywords: []
      from_address: "a000@qwer.com"
      date_range: { start: "__YESTERDAY_ISO__", end: "__YESTERDAY_ISO__" }
  - input: "오늘 결재 관련 메일 보여줘"
    output:
      keywords: ["결재"]
      from_address: null
      date_range: { start: "__CURRENT_DATE_ISO__", end: "__CURRENT_DATE_ISO__" }

# Server-side keyword post-filtering stopwords.
# This is applied after LLM extraction as a safety net.
stopwords:
  - "오늘"
  - "어제"
  - "그제"
  - "저번주"
  - "지난주"
  - "이번주"
  - "이번"
  - "지난"
  - "저번"
  - "온"
  - "받은"
  - "메일"
  - "이메일"
  - "보여줘"
  - "보여"
  - "알려줘"
  - "알려"
  - "찾아줘"
  - "찾아"
  - "검색"
  - "관련"
  - "관해서"
  - "대해"
  - "대해서"
  - "좀"
  - "해주세요"
  - "해줘"

