# Recruitment 도메인 프롬프트 설정

description: "채용 도메인 - 인재 추천 및 이력서 요약"
features: |
  - Redis 기반 컨텍스트 관리: 검색된 인재 목록, 선택된 이력서 정보 등을 Redis에 저장하여 멀티턴 대화 지원
  - 벡터 DB 검색: Milvus 벡터 데이터베이스에서 이력서를 검색하여 인재 추천
  - LLM 기반 요약: 선택된 이력서를 LLM으로 핵심 요약
  - 멀티턴 대화: "1번 요약해줘", "2번 자세히" 같은 요청 시 이전 검색 컨텍스트를 활용
sub_agents:
  search:
    description: "인재 검색 및 추천"
    capabilities:
      - "벡터 DB 기반 이력서 검색"
      - "키워드/기술 스택 기반 인재 추천"
      - "경력/포지션 기반 인재 추천"
      - "인재 목록 제공 (번호 표시)"
    keywords:
      positive:
        - "인재"
        - "이력서"
        - "지원자"
        - "채용"
        - "추천"
        - "검색"
        - "찾아"
        - "applicant"
        - "candidate"
        - "resume"
        - "cv"
        - "recruitment"
      negative: []
    examples:
      - "Python 개발자 인재 추천해줘"
      - "5년 이상 경력 개발자 찾아줘"
      - "이력서 검색해줘"
      - "React 개발자 추천"
  summarize:
    description: "이력서 핵심 요약"
    capabilities:
      - "선택된 이력서의 핵심 정보 요약"
      - "경력, 기술 스택, 강점 추출"
      - "채용 추천 포인트 제시"
      - "구체적 성과 및 수치 중심 요약"
      - "검색 쿼리 컨텍스트 반영"
    keywords:
      positive:
        - "요약"
        - "자세히"
        - "상세"
        - "상세히"
        - "알려줘"
        - "보여줘"
      negative: []
    examples:
      - "1번 요약해줘"
      - "2번 자세히 알려줘"
      - "3번 인재 상세 정보"
    summary_prompt: |
      당신은 채용 전문가입니다. 주어진 이력서를 분석하여 채용 담당자가 빠르게 판단할 수 있도록 핵심 정보를 요약해주세요.

      다음 형식으로 요약하세요:

      ## 기본 정보
      - 이름: [이름]
      - 포지션: [지원 포지션]
      - 경력: [경력년수 및 레벨]

      ## 핵심 경력 요약
      [주요 회사 및 역할을 2-3줄로 요약]
      - 회사명, 기간, 주요 역할

      ## 주요 성과 (구체적 수치 포함)
      [이력서에 명시된 구체적 성과를 나열]
      - 예: "트래픽 50% 증가", "응답속도 40% 개선", "배포 장애 50% 감소" 등
      - 수치가 없는 경우 구체적인 업무 성과를 기술

      ## 핵심 기술 스택
      [실제 사용 경험이 있는 기술만 나열, 숙련도 표시 가능]
      - 주요 기술: [기술명]
      - 보조 기술: [기술명]

      ## 주요 강점 (3가지)
      1. [기술적 강점]
      2. [비즈니스 임팩트]
      3. [협업/리더십 또는 기타 강점]

      ## 채용 추천 포인트
      [이 포지션에 적합한 이유를 구체적으로 설명]
      - 검색 조건과의 매칭도
      - 특별히 주목할 만한 역량

      ## 주의사항/고려사항
      [채용 시 확인이 필요한 사항이나 잠재적 리스크]
      - 없으면 "특별한 주의사항 없음"으로 표시

      **작성 원칙:**
      - 간결하고 명확하게 작성
      - 이력서에 없는 내용은 추측하지 마세요
      - 구체적 수치와 성과를 최대한 포함
      - 검색 조건과 관련된 강점을 특히 강조
classification_criteria: |
  사용자 질의를 분석하여 다음 채용 서브 에이전트 중 하나로 분류:
  
  **분류 기준:**
  - search: 인재 추천, 이력서 검색, 지원자 찾기 등 검색/추천 요청
    * 예: "Python 개발자 인재 추천해줘", "이력서 검색해줘", "5년 경력 개발자 찾아줘"
  - summarize: 이전에 추천받은 인재 중 한 명을 선택하여 상세 요약 요청
    * **중요**: 숫자로 시작하거나 "번"이 포함된 요청은 이전 검색 결과의 상세 요청
    * 예: "1번 요약해줘", "2번 자세히", "3번 상세 정보", "1번 인재 알려줘"
    * 패턴: "숫자 + (번) + (요약/자세히/상세/알려줘/보여줘)" -> summarize
  
  **주의사항:**
  - 숫자로 시작하는 질문은 이전 검색 결과의 상세 요청일 가능성이 매우 높음
  - 예: "1번 요약해줘" -> summarize
  - 예: "2번 자세히 알려줘" -> summarize
  - 이전 검색 결과가 없으면 search로 분류하여 새로 검색 수행
output_format: '{"intent": "search|summarize"}'

