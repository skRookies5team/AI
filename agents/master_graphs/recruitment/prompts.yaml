  # 경력 범위 패턴
  experience_range_patterns:
    - pattern: '(\d+\.?\d*)\s*년?\s*(?:이상|이상의|over|more|or\s+more)'
      type: 'min'
      description: "이상 조건 (예: 5년 이상)"
    - pattern: '(\d+\.?\d*)\s*years?\s*(?:이상|over|more|or\s+more)'
      type: 'min'
      description: "이상 조건 (영문)"
    - pattern: '(\d+\.?\d*)\s*년?\s*(?:초과|보다\s*많은|over)'
      type: 'min_over'
      description: "초과 조건 (예: 5년 초과)"
    - pattern: '(\d+\.?\d*)\s*years?\s*(?:over|more\s+than)'
      type: 'min_over'
      description: "초과 조건 (영문)"
    - pattern: '(\d+\.?\d*)\s*년?\s*(?:이하|under|less)'
      type: 'max'
      description: "이하 조건 (예: 5년 이하)"
    - pattern: '(\d+\.?\d*)\s*years?\s*(?:이하|under|less)'
      type: 'max'
      description: "이하 조건 (영문)"
    - pattern: '(\d+\.?\d*)\s*년?\s*(?:미만|보다\s*적은|less\s+than)'
      type: 'max_under'
      description: "미만 조건 (예: 5년 미만)"
    - pattern: '(\d+\.?\d*)\s*years?\s*(?:less\s+than)'
      type: 'max_under'
      description: "미만 조건 (영문)"
    - pattern: '(\d+\.?\d*)\s*(?:[-~부터]|to|~)\s*(\d+\.?\d*)\s*년?'
      type: 'range'
      description: "범위 조건 (예: 3-5년)"
    - pattern: '(\d+\.?\d*)\s*years?\s*(?:[-~부터]|to|~)\s*(\d+\.?\d*)\s*years?'
      type: 'range'
      description: "범위 조건 (영문)"
    - pattern: '(\d+\.?\d*)\s*년?\s*이상\s*(\d+\.?\d*)\s*년?\s*이하'
      type: 'range'
      description: "범위 조건 (예: 3년 이상 5년 이하)"
    - pattern: '(\d+\.?\d*)\s*years?\s*(?:and|to)\s*(\d+\.?\d*)\s*years?'
      type: 'range'
      description: "범위 조건 (영문)"
    - pattern: '약\s*(\d+\.?\d*)\s*년?'
      type: 'exact'
      description: "정확한 경력 (예: 약 5년)"
    - pattern: 'about\s*(\d+\.?\d*)\s*years?'
      type: 'exact'
      description: "정확한 경력 (영문)"

