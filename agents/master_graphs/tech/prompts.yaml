      summary_generation:
        prompt: |
          다음은 사용자의 질문과 {source_description} ScienceON 검색 결과입니다.
          사용자가 빠르게 이해할 수 있도록 한국어로 친절하게 요약 답변을 작성해 주세요.
          ⚠️ 논문 제목 목록을 포함하지 말고, 검색 결과 요약만 제공하세요.
          만약 결과가 없다면, 재검색 팁과 가능한 이유를 안내해 주세요.

          답변 마지막에 '추가적인 정보가 필요하시면 논문 번호(예: 1번)나 제목과 함께 질문해 주세요.'라는 안내 문구를 포함해 주세요.

          [사용자 질문]
          {user_query}

          [검색 키워드]
          {keyword}

          [검색 소스]
          {search_source}

          [검색 결과 개수]
          {results_count}건
classification_criteria: |
  사용자 질의를 분석하여 다음 기술 서브 에이전트 중 하나로 분류:
  - patent: 특허, Patent 관련 (명시적으로 특허를 언급하거나 특허 검색 의도가 명확한 경우)
  - article: 논문, Article, paper, 학술, ScienceON 관련 (명시적으로 논문을 언급하거나 논문 검색 의도가 명확한 경우)
  - ambiguous: 출처와 키워드 모두 불명확
  - missing_source: 검색할 키워드는 있지만 특허/논문 중 어디서 검색할지 불명확
  - missing_keyword: 특허/논문 중 어디서 검색할지는 명확하지만 무엇을 검색할지 모름(키워드 없음)
  
  ⚠️ 중요 분류 규칙:
  
  1. 명시적 키워드가 있는 경우(검색 키워드 있음):
     - "특허", "patent", "논문", "paper", "학술" 같은 명시적 키워드가 있으면 반드시 해당 intent로 분류
     * 예시: 배터리 논문 좀 찾아줄래? → article
     * 예시: 배터리 특허 좀 찾아줄래? → patent
     * 예시: 배터리랑 딥러닝 논문 좀 찾아줄래? → article
  
  2. 구체적인 기술 질의 패턴 (키워드 없음):
     - 다음 패턴이 있으면 "article"로 분류 (논문이 더 포괄적이므로):
       * "X이 뭐야", "X란 무엇", "X의 개념", "X에 대해", "X를 설명", "X는 어떻게", "X의 원리"
       * 예시: "마르코프 체인이 뭐야?" → article
       * 예시: "딥러닝이란 무엇인가?" → article
       * 예시: "배터리 효율의 원리는?" → article
       * 예시: "전기차 작동 원리를 알려줘" → article
     - 기술 용어나 개념에 대한 설명/정의 요청은 논문 검색이 더 적합
  
  3. 일반적인 기술 키워드만 있는 경우:
     - "기술", "AI", "머신러닝", "딥러닝", "알고리즘", "배터리", "전기차" 등 일반적인 기술 키워드만 있고
     - 위의 구체적 질의 패턴도 없고
     - 명시적 키워드도 없으면
     → "missing_source"로 분류하여 사용자에게 선택을 요청
     * 예시: "AI 찾아줄래?" → missing_source
     * 예시: "배터리 관련 좀 검색해줘" →  missing_source
     * 예시: "기술" → missing_source

  4. 명시적 키워드만 있는 경우(검색 키워드 없음):
     * 예시: "논문 검색해줘" → missing_keyword
     * 예시: "특허 찾아줘" → missing_keyword

  5. 모두 불명확한 경우:
     * 예시: "검색해줘" → ambiguous

  ⚠️ 최종 판단 기준:
  - 중요 분류 규칙을 참고해 patent|article|ambiguous|missing_source|missing_keyword 중 하나로 분류
  - 하지만 구체적인 기술 질의 패턴이 있으면 "article"로 분류

output_format: '{"intent": "patent|article|ambiguous|missing_source|missing_keyword"}'











