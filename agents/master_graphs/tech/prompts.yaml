          아래 규칙을 참고하여 답변을 작성하세요.
          
          # 1단계: 질문 유형 판별
          
          **단답형 질문**: 정의, 수치, 여부, 특정 사실, 간단한 개념, 저널명, 저자명 등
          **설명형 질문**: 이유(Why), 방법(How), 비교, 분석, 장단점, 의의, 프로세스 등
          
          # 2단계: 제공된 정보 확인
          
          사용자 질문: {user_input}
          
          관련 논문 정보:
          {context_text}
          
          # 3단계: 답변 작성 규칙

          **[공통 규칙]**
          - 첫 1-2문장에 질문에 대한 직접적인 답변 제시
          - 서론("답변드리겠습니다", "제공된 논문에서" 등) 없이 바로 본문 시작
          - **답변 불가 시**: "제공된 논문 정보에서 [구체적 정보]를 확인할 수 없습니다"라고 명시
          
          **[중요: 정보 선택 원칙]**
          - context_text를 전체적으로 검토하되, 질문에 답하기 위해 필수적인 내용만 선택
          - 관련 없는 정보는 답변에 포함하지 않음
          - 추측이나 일반적 지식으로 답변을 보충하지 않음
          - 문서에 없는 내용은 절대 만들어내지 않음
          
          **[단답형 질문 답변 방식]**
          - 2-3문장 이내로 간결하게 작성
          - 핵심 정보만 정확히 전달
          - 출처 논문명은 문장 끝에 자연스럽게 언급 (예: "...입니다 (논문명).")
          - 여러 논문에서 같은 답변이 나온 경우 하나만 언급
          
          예시:
          Q: "딥러닝의 정의는?"
          A: "딥러닝은 다층 신경망을 사용하여 데이터의 복잡한 패턴을 학습하는 기계학습 기법입니다."
          
          **[설명형 질문 답변 방식]**
          - 첫 문장: 질문에 대한 핵심 답변 (결론 우선)
          - 이후 문단:
            * 논문별로 구분하여 상세 설명
            * 각 논문의 제목을 자연스럽게 언급
            * 구체적 인용과 수치 포함
            * 필요시 논문 간 비교/종합 분석
          - 논리적 흐름으로 정보 구조화
          
          예시:
          Q: "강화학습의 최근 발전은?"
          A: "최근 강화학습은 모델 기반 접근법과 대규모 사전학습 결합을 통해 발전하고 있습니다.
          
          Smith et al.(2024) 연구에서는 World Model 기반 접근법으로 샘플 효율성을 10배 개선했으며, Lee et al.(2024)는 Transformer 아키텍처를 활용해 멀티태스크 학습 성능을 향상시켰습니다."
          
          # 4단계: 최종 점검
          
          - [ ] 첫 문장이 질문에 직접 답변하는가?
          - [ ] 근거 없는 추측이나 일반론이 포함되지 않았는가?
          - [ ] 출처 논문이 적절히 명시되었는가?
          - [ ] 불필요한 정보(질문과 무관한 내용)가 제거되었는가?
          - [ ] 한국어 표현이 자연스럽고 전문적인가?
      ask_search_source:
        question: |
          사내 서버에 관련 정보가 있는데 어디서 검색하시겠습니까?
          1. 사내 서버에서 검색 (빠른 답변)
          2. 웹에서 검색 (최신 정보)
          예시) 1번, 2번, 사내 서버, 웹
      keyword_generation:
        prompt: |
          사용자 질의에서 학술 논문 검색에 적합한 핵심 키워드만 추출하세요.

          추출 규칙:
          1. '논문', 'paper', '학술', 'ScienceON', '연구', '관련', '자료', '웹', '사내', '서버', '검색', '찾아', '알려', '줘' 등 도메인 및 동작 관련 단어, 조사, 번호, 설명, 불릿, 접두어는 제외하세요.
          2. 오타가 있다면 올바른 학술 용어로 수정하세요.
          - 예: '베터리' -> '배터리', '인공지능' -> '인공지능' (이미 올바름)
          3. 출력 형식: 사용자가 명시한 각 핵심 키워드를 쉼표로 구분해서 반환해.
            * 사용자가 조사(예시: '랑', '와', '과', '하고', ',')로 여러 키워드를 명시했으면 → 각각을 쉼표로 구분해서 반환
              예: '배터리랑 디스플레이' -> '배터리, 디스플레이'
              예: '배터리, 디스플레이' -> '배터리, 디스플레이'
            * 사용자가 단순히 띄어쓰기만 있는 경우(예: '전기차 배터리') → 하나의 키워드로 합쳐서 반환
              예: '전기차 배터리' -> '전기차배터리'
          4. 각 키워드는 1~2개의 핵심 단어로 구성하고, 질문에 등장한 핵심 개념에서만 선택하세요.
          
          ⚠️ 중요: 실제 검색어가 없으면(예: '논문 찾아줘', '논문 좀 찾아줄래', '논문 검색해줘' 같이 도메인 키워드만 있는 경우) 반드시 아무것도 출력하지 말고 완전히 빈 문자열을 반환하세요.

          - 예시 입력: '배터리 관련 논문 필요해' -> 예시 출력: 배터리
          - 예시 입력: '배터리랑 디스플레이 관련 논문 필요해' -> 예시 출력: 배터리, 디스플레이
          - 예시 입력: '전기차 배터리 관련 논문' -> 예시 출력: 전기차배터리
          - 예시 입력: '전기차배터리 관련 논문' -> 예시 출력: 전기차배터리
          - 예시 입력: '기술' -> 예시 출력: 기술
          - 예시 입력: '인공지능으로 찾아줘' -> 예시 출력: 인공지능
          - 예시 입력: '머신러닝' -> 예시 출력: 머신러닝
          입력: {cleaned_input}
