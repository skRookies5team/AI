# Tech 도메인 프롬프트 설정

description: "기술 도메인 - 특허/논문 검색"
features: |
  - Redis 기반 컨텍스트 관리: 검색 결과, 마지막 검색 키워드, 표시된 결과 개수 등을 Redis에 저장하여 멀티턴 대화 지원
  - 검색 소스 선택: 웹 검색 또는 사내 서버 검색 선택 지원
  - 대화식 응답: 이전 검색 결과에 대한 질문 시 새로운 검색 없이 대화식으로 응답
sub_agents:
  patent:
    description: "특허 검색"
    capabilities:
      - "특허 검색"
      - "특허 상세 정보 조회"
      - "특허 벡터화 (선택적)"
    keywords:
      positive:
        - "특허"
        - "patent"
        - "Patent"
      negative: []
    examples:
      - "스마트워치 특허 검색해줘"
      - "AI 관련 특허 찾아줘"
    search_mode_classification_criteria: |
      사용자의 검색 모드 선택을 분석하여 분류하세요:
      
      - server: "1", "1번", "서버", "벡터", "db", "데이터베이스", "내부", "사내" 등
        예시: "내부 데이터에서 찾아볼래", "벡터DB에서 검색", "사내 서버에서"
      
      - web: "2", "2번", "웹", "kipris", "인터넷", "온라인" 등
        예시: "인터넷에서 찾아볼래", "웹에서 검색해줘", "KIPRIS에서 검색"
    yes_no_classification_criteria: |
      사용자의 예/아니오 답변을 분석하여 분류하세요:
      
      - yes: "네", "예", "좋아", "해줘", "그래", "좋아요", "진행해줘", "해볼래", "해볼게" 등
      - no: "아니오", "아니", "안해", "필요없어", "괜찮아", "안 할게요", "안해도 돼" 등
    web_search_question_prompt: |
      사용자가 서버 기반 검색을 요청했지만, 서버에 해당 키워드와 관련된 특허 자료가 저장되어 있지 않은 상황입니다.
      
      다음 정보를 바탕으로 사용자에게 자연스럽고 친절하게 웹 검색을 제안하는 질문을 생성하세요:
      
      - 사용자 검색어: "{keyword}"
      - 검색 모드: 서버 기반 검색 (벡터DB)
      - 상황: 서버에 저장된 자료가 없음
      
      ⚠️ 중요: 사용자 검색어("{keyword}")를 그대로 사용하세요. 키워드를 축약하거나 요약하지 마세요.
      예를 들어, 검색어가 "전기차 배터리 기술"이면 "전기차 배터리" 또는 "전기차 기술"로 축약하지 말고 "전기차 배터리 기술" 그대로 사용하세요.
      
      질문 생성 시 다음 사항을 고려하세요:
      1. 사용자의 검색 의도를 존중하며, 서버에 자료가 없다는 것을 명확히 전달
      2. 웹 검색의 장점(광범위한 검색, 최신 정보)을 간단히 언급
      3. 사용자가 쉽게 답변할 수 있도록 명확한 선택지를 제시
      4. 친절하고 도움이 되는 톤 유지
      5. 검색어는 반드시 "{keyword}" 그대로 사용 (축약 금지)
      
      예시:
      - "서버에 '{keyword}' 관련 특허 자료가 저장되어 있지 않습니다. 웹에서 찾아드릴까요?"
      - "안타깝게도 서버에 '{keyword}' 관련 특허가 없습니다. KIPRIS 웹 검색으로 더 많은 정보를 찾아드릴 수 있습니다. 진행할까요?"
      
      질문만 생성하세요 (추가 설명 없이).
    search_mode_response_detection_prompt: |
      대화 히스토리와 현재 사용자 입력을 분석하여 특허 검색 모드 선택 응답인지 판단하세요.
      
      **분석 조건:**
      1. 이전 대화에 특허 검색 관련 질문이 있었는지 (예: "특허 찾아줘", "특허 검색")
      2. 이전 대화에 "검색 방식을 선택해주세요" 또는 "서버 기반 검색", "웹 검색" 같은 질문이 있었는지
      3. 현재 사용자 입력이 그 질문에 대한 응답인지
      
      **검색 모드 선택 응답의 예시:**
      - "내부 데이터에서 찾아볼래" → server 모드 선택
      - "서버에서 검색해줘" → server 모드 선택
      - "회사 내부에 있나" → server 모드 선택 (서버 데이터 확인 질문)
      - "내부에 있나" → server 모드 선택 (서버 데이터 확인 질문)
      - "인터넷에서 찾아줘" → web 모드 선택
      - "웹 검색해줘" → web 모드 선택
      - "1" 또는 "1번" → server 모드 선택
      - "2" 또는 "2번" → web 모드 선택
      - "내부 데이터" → server 모드 선택
      - "서버에 있나" → server 모드 선택 (서버 데이터 확인 질문)
      
      **일반 질문과의 차이:**
      - 검색 모드 선택 응답: 이전에 "검색 방식을 선택해주세요" 질문이 있었고, 그에 대한 응답
      - 일반 질문: 특허 검색과 관련 없는 새로운 질문
      
      **대화 히스토리:**
      {history_context}
      
      **현재 사용자 입력:**
      {user_query}
      
      JSON 형식으로만 응답:
      {{
        "is_search_mode_response": true 또는 false,
        "search_mode": "server" 또는 "web" 또는 null,
        "confidence": 0.0 ~ 1.0
      }}
      
      is_search_mode_response가 true이고 confidence가 0.7 이상이면 tech 도메인으로 유지해야 합니다.
    keyword_generation:
      description: "사용자 질의를 특허 검색용 핵심 키워드로 변환"
      prompt: |
        다음 사용자 질의를 특허 검색용 핵심 키워드로 요약해줘.
        - 출력 형식: 하나의 키워드 또는 쉼표로 구분된 최대 3개의 키워드를 반환해.
        - ⚠️ 중요: 
          * 붙어있거나 공백으로 구분된 키워드는 절대 분리하지 마세요. 하나의 키워드로 합쳐서 반환하세요.
            예: '배터리 충전' -> '배터리충전' (하나의 키워드, 쉼표 없음)
            예: '전기차 배터리' -> '전기차배터리' (하나의 키워드, 쉼표 없음)
          * 조사(예시: '랑', '와', '과', '하고', ',')로 구분된 키워드만 쉼표로 구분하세요.
            예: 'AI랑 딥러닝' -> '인공지능, 딥러닝' (쉼표로 구분)
        - 모든 키워드는 무조건 사용자 입력에 존재하는 단어로만 선택해.
        - 각 키워드는 1~2개의 핵심 단어로 구성하고, 질문에 등장한 핵심 개념에서만 선택해.
        - '특허', 'Patent', '검색', '찾아', '알려', '줘', '주세요', '관련', '정보' 같은 일반 단어와 조사는 모두 제거해.
        - ⚠️ 매우 중요: '특허'를 제거할 때 다른 단어(예: '기술', '기법' 등)로 변환하지 말고 단순히 제거만 하세요.
          예: '배터리 특허' -> '배터리' (O), '배터리 기술' (X)
          예: 'AI 특허' -> 'AI' 또는 '인공지능' (O), 'AI 기술' (X)
        - 번호, 설명, 불릿, 접두어 같은 추가 문장은 절대 포함하지 마.
        입력: {user_input}
        출력:
      stop_words:
        - "특허"
        - "Patent"
        - "patent"
        - "검색"
        - "찾아"
        - "알려"
        - "줘"
        - "주세요"
        - "관련"
        - "정보"
        - "자료"
        - "요청"
        - "요청한"
        - "검색한"
        - "이전에"
        - "전에"
      keyword_limit: 3
    keyword_extraction:
      description: "특허 제목/초록 텍스트에서 핵심 기술 키워드 추출"
      prompt: |
        다음 특허 제목/초록 텍스트에서 핵심 기술 키워드를 추출해줘.
        - 출력 형식: 쉼표로 구분된 최대 3개의 키워드만 반환해.
        - 핵심 기술 용어만 선택하고, 일반적인 단어는 제거해.
        - 예시 입력: '배터리 충전 장치 및 방법' -> 예시 출력: 배터리, 충전
        입력: {text}
        출력:
      stop_words:
        - "특허"
        - "Patent"
        - "patent"
        - "검색"
        - "찾아"
        - "알려"
        - "줘"
        - "주세요"
        - "관련"
        - "정보"
        - "자료"
        - "요청"
        - "요청한"
        - "검색한"
        - "이전에"
        - "전에"
      keyword_limit: 3
    search_phrase_generation:
      description: "사용자 질의를 특허 검색용 핵심 구문으로 변환 (키워드 분리 없이 하나의 구문으로)"
      prompt: |
        다음 사용자 질의를 특허 검색용 핵심 검색 구문 하나로 변환해줘.
        - 키워드를 분리하지 말고, 하나의 의미 있는 기술 개념 구문으로 생성해줘.
        - 불필요한 단어("특허", "찾아줘", "검색", "관련해서" 등)는 제거하고 핵심 기술 용어만 남겨줘.
        - ⚠️ 매우 중요: '특허'를 제거할 때 다른 단어(예: '기술', '기법' 등)로 변환하지 말고 단순히 제거만 하세요.
        - 출력은 최대 10단어 이내의 자연스러운 구문이어야 해.
        예시:
        - 입력: "전기차 베터리 관련해서 특허좀 찾아줘" → 출력: "전기차 배터리" (O), "전기차 배터리 기술" (X)
        - 입력: "AI 딥러닝 특허 검색" → 출력: "인공지능 딥러닝"
        - 입력: "초전도체 기술 현황" → 출력: "초전도체 기술" (입력에 '기술'이 이미 있으면 유지)
        
        입력: {user_input}
        출력:
  article:
    description: "논문 검색"
    features: |
      - LLM 기반 Intent 분류: 사용자 입력을 search/detail/download로 자동 분류
        * search: 새로운 논문 검색 요청 (이전 키워드와 다른 주제 또는 명시적 검색 키워드)
        * detail: 이전 검색 결과 중 특정 논문의 상세 정보 요청 (순번 기반)
        * download: 이전 검색 결과 중 특정 논문의 PDF 다운로드 요청
      - 이전 키워드 비교: 같은 키워드면 이전 결과 재사용, 다른 키워드면 새 검색
      - 벡터DB 통합: 사내 서버(Milvus) 검색 결과를 Redis에 저장하여 다음 턴에서 재사용
      - PDF 처리 최적화: docling 및 Vision API 병렬 처리로 빠른 텍스트 추출
      - RAG 답변: 벡터DB에서 추출한 논문 내용을 기반으로 상세 답변 생성
      - 멀티턴 대화 지원:
        * 이전 검색 결과 유지 및 재사용
        * 순번 기반 상세 조회 ("1번 논문", "2번 논문")
        * 여러 논문 비교 요청 ("1번이랑 2번 논문 비교")
        * 순번 없이 이전 선택 논문 사용 (last_selected_paper_index)
    capabilities:
      - "논문 검색 (ScienceON)"
      - "논문 상세 정보 조회 (순번 기반)"
      - "여러 논문 비교 요청"
      - "논문 PDF 다운로드"
      - "논문 벡터화 및 사내 서버 저장"
      - "사내 서버(Milvus)에서 논문 검색"
      - "이전 검색 결과 재사용"
    keywords:
      positive:
        - "논문"
        - "paper"
        - "학술"
        - "ScienceON"
        - "KISTI"
        - "Article"
      negative: []
    examples:
      - "머신러닝 논문 찾아줘"
      - "ScienceON에서 AI 논문 검색"
      - "배터리 논문 좀 찾아줄래?"
      - "1번 논문에 대해 알려줘"
      - "1번이랑 2번 논문 비교해줘"
      - "1번 논문 다운로드"
      - "사내 서버에서 배터리 논문 찾아줘"
    important_rules:
      - '같은 키워드 재검색 시 이전 결과를 재사용 (새로운 검색으로 처리하지 않음)'
      - '순번 기반 요청("1번", "2번")은 이전 검색 결과가 있어야 detail/download로 분류 (이전 도메인 확인 필요)'
      - '여러 논문 비교 요청("1번이랑 2번 논문 비교")은 detail intent로 처리'
      - '"사내 서버", "웹 검색" 같은 선택 응답은 검색 소스 선택 질문에 대한 답변 (이전 도메인 확인 필요)'
      - '벡터DB 검색 결과는 Redis에 저장되어 다음 턴에서 재사용 가능'
    prompts:
      intent_classification:
        system_prompt: |
          당신은 ScienceON 논문 검색 챗봇의 의도 분류 전문가입니다.
          사용자의 입력을 분석하여 다음 중 하나로 분류하세요:

          1. search: 새로운 논문 검색 요청
             - 예시: '인공지능 논문 찾아줘', '디스플레이 관련 논문 검색', '머신러닝 논문'
             - 특징: 검색어나 주제가 명시되어 있고, 다운로드/상세 정보 관련 키워드가 없음
             - 중요: 이전 검색 키워드({previous_keyword})와 다른 주제를 검색하면 search로 분류 (예: 이전='배터리', 현재='디스플레이' → search)
             - 중요: 이전 검색 키워드({previous_keyword})가 여러 개일 경우(쉼표로 구분), 사용자 입력이 이전 키워드 중 하나와 관련이 있어도 다른 하나가 다르면 search로 분류 (예: 이전='배터리, 리튬이온', 현재='배터리, 디스플레이' → search)
             - 중요: 이전 검색 키워드와 같은 주제라도 명시적으로 검색 키워드('찾아', '검색' 등)가 있으면 search로 분류

             - ⚠️ 예외: 순번(1번, 2번, 첫 번째 등)이 있으면 detail 또는 download로 분류 (예: '1번 논문 비교해줘' → detail, '1번 논문 다운로드' → download)

          2. detail: 이전 검색 결과 중 특정 논문의 상세 정보 요청
             - 예시: '1번 논문에 대해 알려줘', '2번째 논문 상세 정보', '첫 번째 논문 설명해줘', '1번', '2번'
