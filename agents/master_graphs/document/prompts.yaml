# Document 도메인 프롬프트 설정

description: "문서 도메인 - 문서 작성/업로드/변환"
features: |
  - Redis 기반 컨텍스트 관리: 생성한 문서 템플릿 타입, 변수 정보 등을 Redis에 저장
  - Structured Output Parser: 문서 생성 시 template_type, variables, output_format 등을 구조화된 형식으로 추출
sub_agents:
  doc_generate:
    description: "문서 자동 작성"
    features: |
      - Structured Output Parser 사용: 사용자 쿼리에서 template_type, variables, output_format 등을 자동 추출
      - Redis 컨텍스트: 생성한 문서 정보를 Redis에 저장하여 멀티턴 대화 지원
        * 이전에 생성한 문서의 템플릿 타입, 제목, 변수 정보를 기억
        * 대화 히스토리를 활용하여 이전 요청에서 템플릿명, 제목, 요구사항 추출
        * "이전 문서와 같은 템플릿으로" 같은 요청 시 이전 컨텍스트 활용
    capabilities:
      - "템플릿 기반 문서 생성"
      - "인사정보 요약 리포트 작성"
      - "제품 비교표 생성"
      - "제품 개발 계획서 작성"
      - "구매 발주서 작성"
      - "월별 손익 분석 보고서 작성"
      - "활동 기준 원가 계산서 작성"
      - "근무 평가서 작성"
      - "휴가 신청서 작성"
      - "출장 신청서 작성"
    templates:
      - "hr_summary_report"  # 인사정보 요약 리포트
      - "product_comparison"  # 제품 비교표
      - "product_development_plan"  # 제품 개발 계획서
      - "purchase_order"  # 구매 발주서
      - "monthly_profit_analysis"  # 월별 손익 분석
      - "activity_based_costing"  # 활동 기준 원가
      - "work_performance_review"  # 근무 평가서
      - "vacation_request_form"  # 휴가 신청서
      - "business_trip_request_form"  # 출장 신청서
    keywords:
      positive:
        - "문서"
        - "보고서"
        - "작성"
        - "템플릿"
        - "생성"
        - "만들어"
        - "계획서"
        - "리포트"
        - "휴가"
        - "연차"
        - "반차"
        - "출장"
        - "신청서"
      negative:
        - "이메일 자동응답"  # 이건 email 도메인으로
        - "메일 자동응답"
    examples:
      - "2024년 1분기 인사정보 요약 리포트 작성해줘"
      - "스마트워치 신제품 개발 계획서 만들어줘"
      - "제품 비교표 템플릿 생성"
      - "휴가 신청서 작성해줘"
      - "연차 신청서 만들어줘"
      - "반차 신청서 생성"
      - "출장 신청서 작성해줘"
      - "출장 신청서 만들어줘"
  update_document:
    description: "문서 업데이트 (복리후생/식단/메뉴얼/이력서)"
    features: |
      - Structured Output Parser 사용: 사용자 쿼리에서 document_title, file_path, document_type 등을 자동 추출
      - 업데이트 가능한 문서: 복리후생, 식단, 메뉴얼, 이력서
      - Redis 컨텍스트: 업데이트한 파일 경로, 청크 수 등을 Redis에 저장하여 멀티턴 대화 지원
      - 파일 파싱: PDF/DOCX 등의 파일에서 텍스트 추출
      - 청킹: 추출된 텍스트를 의미 있는 단위로 분할
      - 임베딩: 각 청크를 벡터로 변환
      - Vector DB Upsert: 임베딩 벡터를 Milvus에 저장/업데이트 (기존 문서 삭제 후 새로 저장)
    capabilities:
      - "복리후생 문서 업데이트"
      - "식단 문서 업데이트"
      - "메뉴얼 문서 업데이트"
      - "이력서 문서 업데이트"
      - "벡터 DB 업데이트"
    keywords:
      positive:
        - "업데이트"
        - "수정"
        - "갱신"
        - "변경"
        - "복리후생"
        - "식단"
        - "메뉴얼"
        - "이력서"
      negative: []
    examples:
      - "복리후생 문서를 업데이트해줘"
      - "식단 파일을 수정해줘"
      - "메뉴얼을 갱신해줘"
      - "이력서 문서를 업데이트해줘"
    structured_output_prompt: |
      사용자의 쿼리에서 문서 업데이트에 필요한 정보를 추출하세요.
      
      **업데이트 가능한 문서 타입:**
      - 복리후생: 회사 복리후생 정책, 휴가규정, 근무제도, 급여 외 혜택, 보험, 수당, 퇴직연금 등
      - 식단: 구내식당 식단, 점심/저녁 메뉴, 식단 추천 등
      - 메뉴얼: 시스템 사용 매뉴얼, Q&A, 사용 방법 안내 등
      - 이력서: 인재 채용 이력서, 지원자 이력서, 채용 관련 문서 등
      
      **추출해야 할 정보:**
      - document_title (필수): 업데이트할 문서 제목. 사용자가 명시적으로 입력한 제목을 그대로 사용하세요. 
        * 사용자가 "이력서"라고 입력하면 document_title은 "이력서"로 설정하세요.
        * 사용자가 "메뉴얼"이라고 입력하면 document_title은 "메뉴얼"로 설정하세요.
        * 사용자가 명시적으로 입력한 제목을 정확히 반영하세요.
      - file_path (선택): 업데이트할 파일 경로. 사용자가 명시적으로 파일 경로를 제공한 경우에만 추출합니다.
      - document_type (필수): 문서 타입. 반드시 "복리후생", "식단", "메뉴얼", "이력서" 중 하나로 정확히 판단해야 합니다.
        * 쿼리에서 "복리후생", "휴가규정", "근무제도", "보험", "수당" 등의 키워드가 있으면 "복리후생"
        * 쿼리에서 "식단", "메뉴", "구내식당", "점심", "저녁" 등의 키워드가 있으면 "식단"
        * 쿼리에서 "메뉴얼", "매뉴얼", "사용 방법", "Q&A" 등의 키워드가 있으면 "메뉴얼"
        * 쿼리에서 "이력서", "채용", "인재", "지원자", "resume" 등의 키워드가 있으면 "이력서"
        * 여러 키워드가 있으면 가장 많이 언급된 타입을 선택하거나, 쿼리의 주 목적을 파악하여 판단하세요.
      
      **주의사항:**
      - document_title은 사용자가 명시적으로 입력한 제목을 정확히 반영해야 합니다. 사용자가 "이력서"라고 입력하면 "이력서"로, "메뉴얼"이라고 입력하면 "메뉴얼"로 설정하세요.
      - document_type은 반드시 "복리후생", "식단", "메뉴얼", "이력서" 중 하나로 정확히 판단해야 합니다.
      - file_path는 선택적이지만, 사용자가 파일 경로를 언급한 경우 추출해야 합니다.
      - 사용자가 "복리후생", "식단", "메뉴얼" 중 하나를 언급하지 않으면 document_title과 document_type을 쿼리 내용을 분석하여 추론하세요.
