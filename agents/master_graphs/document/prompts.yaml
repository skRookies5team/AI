classification_criteria: |
  사용자 질의를 분석하여 다음 문서 서브 에이전트 중 하나로 분류:
  - doc_generate: 문서, 보고서, 작성, 템플릿 관련
  - update_document: 문서 업데이트 (복리후생/식단/메뉴얼/이력서)
  - email_auto_reply: 이메일, 메일, 자동응답 관련 (참고: 실제로는 email 도메인으로 라우팅)
output_format: '{"intent": "doc_generate|update_document|email_auto_reply"}'




