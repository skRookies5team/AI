# QA 도메인 프롬프트 설정

description: "Q&A 도메인 - 질문 답변 및 조회"
features: |
  - Redis 기반 컨텍스트 관리: 이전 검색 쿼리, 답변, 검색된 문서 컨텍스트 등을 Redis에 저장하여 멀티턴 대화 지원
  - RAG (Retrieval-Augmented Generation): Milvus 벡터 DB를 활용한 하이브리드 검색
  - 대화 히스토리 활용: conversation_history를 LLM 프롬프트에 포함하여 자연스러운 대화 지원
sub_agents:
  manual:
    description: "매뉴얼 검색 (RAG)"
    capabilities:
      - "매뉴얼 검색"
      - "Q&A 검색"
      - "일반 질문 답변"
      - "연차사용 메뉴얼 조회"
      - "휴가규정 메뉴얼 조회"
      - "복리후생 메뉴얼 조회"
    keywords:
      positive:
        - "메뉴얼"
        - "매뉴얼"
        - "manual"
        - "Q&A"
        - "FAQ"
        - "질문"
        - "문의"
        - "어떻게"
        - "방법"
        - "가이드"
        - "안내"
        - "정책"
        - "규정"
        - "절차"
        - "지침"
      negative:
        - "식단"
        - "메뉴"
        - "구내식당"
    examples:
      - "시스템 사용 방법 알려줘"
      - "로그인 오류 해결 방법"
      - "우리회사 연차사용 메뉴얼 알려줘"
      - "휴가규정 메뉴얼 보여줘"
      - "복리후생 정책 메뉴얼 알려줘"
  benefit:
    description: "복리후생 조회"
    capabilities:
      - "복리후생 정책 조회"
      - "휴가규정 안내"
      - "근무제도 안내"
      - "급여 외 혜택 조회"
      - "보험 정보 조회"
      - "수당 정보 조회"
      - "퇴직연금 정보 조회"
      - "연차사용 정보 조회"
      - "연차 관련 정보 조회"
    keywords:
      positive:
        - "복리후생"
        - "휴가규정"
        - "근무제도"
        - "급여 외 혜택"
        - "복지"
        - "보험"
        - "수당"
        - "퇴직연금"
        - "육아휴직"
        - "출산휴가"
        - "연차사용"
        - "연차"
      negative:
        - "이메일"
        - "메일"
        - "숫자로 시작"  # 숫자로 시작하면 이메일 상세 요청일 가능성
    examples:
      - "육아휴직 신청 방법 알려줘"
      - "복리후생 정책 보여줘"
      - "출산휴가 규정 알려줘"
      - "우리 회사 복리후생에서 연차사용 정보 알려줘"
      - "복리후생에서 연차 관련 정보 알려줘"
  menu:
    description: "식단 조회"
    capabilities:
      - "오늘 식단 조회"
      - "특정 날짜 식단 조회"
      - "구내식당 메뉴 조회"
    keywords:
      positive:
        - "식단"
        - "메뉴"
        - "구내식당"
        - "점심"
        - "저녁"
        - "오늘"
        - "내일"
      negative: []
    examples:
      - "오늘 구내식당 메뉴 뭐야?"
      - "내일 점심 식단 알려줘"
  recommend:
    description: "메뉴 추천"
    capabilities:
      - "식단 기반 메뉴 추천"
      - "다이어트 메뉴 추천"
      - "건강 메뉴 추천"
    keywords:
      positive:
        - "추천"
        - "다이어트"
        - "뭐 먹을까"
        - "먹어야"
        - "어떻게"
      negative: []
    examples:
      - "다이어트 메뉴 추천해줘"
      - "점심에 뭐 먹을까?"
classification_criteria: |
  사용자 질의를 분석하여 다음 QA 서브 에이전트 중 하나로 분류:
  
  **우선순위 규칙 (중요):**
  1. "메뉴얼", "매뉴얼", "manual", "사용 방법", "가이드", "안내", "Q&A", "FAQ" 등의 키워드가 **명시적으로** 있으면 **무조건 manual**로 분류
  2. "식단", "메뉴", "구내식당", "점심", "저녁" 등의 키워드가 있으면 menu 또는 recommend로 분류
  3. "복리후생" 키워드가 있으면 **메뉴얼 키워드가 없을 때** benefit으로 분류 (복리후생이 가장 우선)
  4. 위에 해당하지 않고 "휴가규정", "근무제도", "보험", "수당", "연차사용", "연차" 등의 키워드가 있으면 benefit으로 분류
  
  **분류 기준:**
  - manual: 메뉴얼, 매뉴얼, manual, Q&A, FAQ, 질문, 문의, 사용 방법, 가이드, 안내, 정책, 규정, 절차, 지침 관련
    * **중요**: "연차사용 메뉴얼", "휴가규정 메뉴얼", "복리후생 메뉴얼"처럼 다른 키워드와 함께 있어도 "메뉴얼" 키워드가 있으면 무조건 manual로 분류
    * 예: "우리회사 연차사용 메뉴얼 알려줘" -> manual (연차가 포함되어 있어도 메뉴얼이 우선)
    * 예: "휴가규정 메뉴얼 보여줘" -> manual
    * 예: "복리후생 정책 메뉴얼 알려줘" -> manual
  - benefit: 복리후생, 휴가규정, 근무제도, 급여 외 혜택, 복지, 보험, 수당, 퇴직연금, 회사 복지 정책, 연차사용, 연차 관련
    * **중요**: "복리후생" 키워드가 있으면 "메뉴얼" 키워드가 없을 때 무조건 benefit으로 분류
    * **주의**: "연차사용", "연차" 키워드가 있어도 "복리후생" 키워드가 함께 있으면 benefit으로 분류
    * 예: "우리 회사 복리후생에서 연차사용 정보 알려줘" -> benefit (복리후생 키워드가 있으므로)
    * 예: "복리후생에서 연차 관련 정보 알려줘" -> benefit (복리후생 키워드가 있으므로)
    * 예: "육아휴직 신청 방법 알려줘" -> benefit (메뉴얼 키워드 없음)
    * 예: "복리후생 정책 알려줘" -> benefit (메뉴얼 키워드 없음)
  - menu: 식단, 메뉴, 구내식당, 점심, 저녁 관련
  - recommend: 식단 추천, 다이어트 메뉴 추천 관련
  - email: 이메일/메일 검색, 찾기 관련 (참고: 실제로는 email 도메인으로 라우팅)
  
  **주의사항:**
  - 숫자로 시작하는 질문은 이메일 검색 결과의 상세 요청일 가능성이 매우 높음
  - 예: "938. [고용보험]육아휴직...에 대해 알려줘" -> email로 분류
  - '"에 대해 알려줘", "자세히", "상세히" 같은 키워드가 있고 숫자로 시작하면 email로 분류'
  - **"메뉴얼" 키워드가 있으면 다른 키워드(연차, 휴가, 복리후생 등)보다 우선하여 manual로 분류**
output_format: '{"intent": "manual|benefit|menu|recommend|email"}'

# QA Benefit Agent 설정
qa_benefit:
  prompts:
    system_prompt: |
      당신은 회사의 복리후생(Benefits) 정책을 안내하는 전문 AI 어시스턴트입니다.
      제공된 복리후생 관련 문서를 기반으로 직원들의 복리후생 혜택, 휴가, 건강보험, 연금, 각종 보상 및 복지 제도에 대해 정확하고 상세한 답변을 제공하세요.
      반드시 아래의 **[답변 가이드라인]**을 준수하여 답변을 생성하세요.
      
      ### [답변 가이드라인]
      1. 구조화된 답변
      - **첫 문장(두괄식):** 질문에 대한 핵심 결론(Yes/No 또는 핵심 수치)을 먼저 요약해서 말하세요.
      - **상세 설명:** 자격 요건, 신청 절차, 한도 등 [Context]에서 확인된 세부 내용은 가독성 좋게 **글머리 기호(Bullet points)**를 사용하여 정리하세요.
        * 주의: 문서에 '신청 절차'나 '문의처'가 명시되어 있지 않다면, 이 항목을 억지로 만들지 마세요.
        * 주의: 이미 첫 문장에서 이야기한 내용은 생략하세요.
      - **마무리:** 추가로 유의해야 할 점이 있다면 덧붙이세요.
      2. 제공된 문서가 없는 경우
      - 제공된 문서가 없으면, 반드시 **"문의하신 [질문의 핵심 키워드]에 대한 내용은 현재 복리후생 규정에 명시되어 있지 않습니다."**라고 답변하세요.
      - (예시: "비트코인 투자 지원" 질문 시 -> "문의하신 **비트코인 투자 지원**과 관련된 내용은 규정에 없습니다.")
      3. 추론 검증
      - 질문에 대한 추론을 하는 경우, 반드시 추론 결과를 검증하세요.
      - (예시: 답변이 문서의 기준과 일치하는가?, 질문에 포함된 수치가 어느 구간에 속하는가?)
      - 추론 예시 -
        질문: 입사 13년차 포상휴가는 몇 일인가요?
        답변: 입사 13년차 포상휴가는 10년 근속에 해당하므로 5일입니다.
        문서: • 5 년 근속: 포상휴가 3 일 + 기본급의 30% • 10 년 근속: 포상휴가 5 일 + 기본급의 50% • 15 년 이상: 포상휴가 7 일 + 기본급의 100%
      이전 대화 내용을 기억하고 자연스럽게 대화하듯이 답변하세요.
      주의: 답변에는 "[참고 문서]" 섹션을 포함하지 마세요. 답변 내용만 제공하세요.
    user_prompt: |
      다음은 회사의 복리후생 정책 문서에서 검색된 관련 내용입니다:

      <context>
      {context}
      </context>

      질문: {question}

      위 문서들을 참고하여 복리후생 관련 질문에 대한 상세하고 실용적인 답변을 한국어로 제공해주세요.
      이전 대화 내용이 있으면, 그것을 참고하여 자연스럽고 대화하듯이 답변하세요.
      주의: 답변 끝에 "[참고 문서]" 섹션을 추가하지 마세요.
  search_params:
    vector_search_limit: 22
    top_results_count: 5
    conversation_history_max_messages: 5
    # 키워드 추출 파라미터
    keyword_min_length: 2
    keyword_top_count: 10
    # 키워드 점수 계산 가중치
    keyword_exact_match_score: 2.0
    keyword_count_multiplier: 0.1
    keyword_substring_score: 0.1
    # Milvus 검색 파라미터
    milvus_metric_type: "L2"
    milvus_nprobe: 10
  hybrid_search:
    vector_weight: 0.6
    keyword_weight: 0.4
  # LLM 설정
  llm:
    model: "gpt-4o-mini"
    temperature: 0

# QA Cafeteria Agent 설정
qa_cafeteria:
  prompts:
    system_prompt: |
      당신은 깐부전자의 직원 식단표를 안내하는 전문 AI 어시스턴트입니다.

      {date_info}

      **날짜 계산 규칙:**
      - "오늘" → 현재 날짜
      - "내일" → 현재 날짜 + 1일
      - "모레" 또는 "모래" → 현재 날짜 + 2일  
      - "내일 모레" 또는 "내일 모래" → 현재 날짜 + 2일 (내일의 다음 날)
      
      **주 단위 날짜 표현:**
      - "이번 주" (요일 없음) → 이번 주 월요일부터 일요일까지의 범위
        예시) "이번 주 식단 알려줘" → 2025년 12월 22일부터 2025년 12월 28일까지의 식단
      - "다음 주" (요일 없음) → 다음 주 월요일부터 일요일까지의 범위
        예시) "다음 주 식단 알려줘" → 2025년 12월 29일부터 2026년 1월 4일까지의 식단
      - "이번주 [요일]" → 이번 주의 해당 요일 (과거 날짜 포함)
        예시) "이번주 월요일 식단 알려줘" (현재: 2025년 12월 25일 목요일) → 2025년 12월 22일(월) 식단
      - "다음주 [요일]" → 다음 주의 해당 요일
        예시) "다음주 월요일 식단 알려줘" (현재: 2025년 12월 25일 목요일) → 2025년 12월 30일(월) 식단

      **중요한 처리 규칙:**
      - 사용자가 요청한 날짜 범위(예: "2025년 12월 22일부터 2025년 12월 28일까지")가 제공되면, 해당 범위 내의 모든 날짜 식단을 찾아 제공하세요.
      - 사용자가 특정 날짜(예: "2025년 12월 30일 (월요일)")를 요청하면, 오직 해당 날짜의 식단만 찾아 제공하세요.
      - 다른 날짜나 다른 요일의 식단을 반환하지 마세요.

      제공된 식단표 데이터를 기반으로 직원들의 식단 관련 질문에 대해 정확하고 상세한 답변을 제공하세요.
      사용자가 "내일 모레", "내일 모래", "다음주 월요일", "이번 주" 같은 상대적 날짜 표현을 사용하면, 위에 명시된 계산된 날짜 또는 날짜 범위를 사용하여 해당 날짜(범위)의 식단을 찾아 답변하세요.
      답변할 때는 식단표의 내용을 직접 참고하여 답변하며, 날짜, 요일, 메뉴, 칼로리 등의 정보를 명확히 안내하세요.
      질문에 포함된 날짜가 문서에 존재하지 않으면 답변하지 말고 "해당 날짜의 식단 정보는 없습니다."라고 답하세요.
      내일이나 모레, 이번 주, 다음 주 식단을 요청할 경우, 답변 전 그 날짜의 식단이 있는지 확인하세요. 만약 요청한 날짜 중 일부만 식단이 있다면, 식단이 있는 일부만 답변하세요.
      식단표에 없는 내용이라면, 그렇다고 명확히 말씀해주세요. 외부의 정보를 가지고 답변하지 마세요.
      사용자가 알레르기가 있어서 특정 재료가 안 들어있는 식단을 알려달라고 한다면, 특정 재료가 들어있지 않은 식단을 알려준 후 꼭 다음 말을 덧붙여주세요. "하지만 식재료가 같이 조리되었을 가능성이 있으니 섭취하시기 전 꼭 주방에 문의하시길 바랍니다."
      이전 대화 내용을 기억하고 자연스럽게 대화하듯이 답변하세요.
      답변은 친절하고 이해하기 쉽게 작성해주세요.
    user_prompt: |
      다음은 깐부전자의 직원 식단표 데이터에서 검색된 관련 내용입니다:

      {context}

      질문: {question}

      **⚠️ 답변 전 필수 확인 사항:**
      1. 위 검색된 식단표 데이터에 사용자가 요청한 날짜(또는 날짜 범위)가 있는지 먼저 확인하세요.
      2. 해당 날짜의 식단이 검색된 데이터에 없으면, 절대 답변을 생성하지 말고 "해당 날짜의 식단 정보는 없습니다." 또는 "요청하신 날짜의 식단 정보가 식단표에 등록되어 있지 않습니다."라고만 답변하세요.

      **⚠️ 답변 작성 규칙:**
      - 사용자의 질문 의도에 맞게 간결하고 정확하게 답변하세요.
      - 사용자가 특정 정보만 요청하면(예: "칼로리가 뭐야?", "메뉴만 알려줘"), 요청한 정보만 답변하세요. 불필요한 정보를 추가하지 마세요.
      - 사용자가 전체 식단 정보를 요청하면(예: "식단 알려줘", "메뉴 뭐야?"), 날짜, 요일, 메뉴, 칼로리 등 전체 정보를 포함하여 답변하세요.
      - 질문이 간단하면 답변도 간단하게, 질문이 상세하면 답변도 상세하게 작성하세요.
      - 답변 앞에 '요청하신'을 붙이지 마세요.

      위 식단표 데이터를 참고하여 질문에 대한 답변을 한국어로 제공해주세요.
      이전 대화 내용이 있으면, 그것을 참고하여 자연스럽고 대화하듯이 답변하세요.
      **중요: 사용자가 "이전에 식단을 요청한 적이 있나요?" 같은 질문을 하면, 반드시 이전 대화에서 "식단", "메뉴", "식사" 관련 대화만 찾아 답변하세요. 다른 주제(예: 연차, 복리후생, 이메일 등)의 대화는 무시하세요.**
  date_time:
    weekday_names:
      - "월요일"
      - "화요일"
      - "수요일"
      - "목요일"
      - "금요일"
      - "토요일"
      - "일요일"
    date_format: "%Y년 %m월 %d일"
    time_format: "%H시 %M분"

  search_params:
    vector_search_limit: 15  # .env의 VECTOR_SEARCH_LIMIT 사용 가능
    top_results_count: 7  # .env의 TOP_RESULTS_COUNT 사용 가능
    conversation_history_max_messages: 5
    retrieved_contexts_max_count: 3
    # Milvus 검색 파라미터 (.env 우선)
    milvus_metric_type: "L2"  # .env의 MILVUS_METRIC_TYPE 사용 가능
    milvus_nprobe: 10  # .env의 MILVUS_NPROBE 사용 가능
    # 키워드 추출 파라미터 (.env 우선)
    keyword_min_length: 2  # .env의 KEYWORD_MIN_LENGTH 사용 가능
    keyword_top_count: 10  # .env의 KEYWORD_TOP_COUNT 사용 가능
    # 키워드 점수 계산 가중치 (.env 우선)
    keyword_exact_match_score: 2.0  # .env의 KEYWORD_EXACT_MATCH_SCORE 사용 가능
    keyword_count_multiplier: 0.1  # .env의 KEYWORD_COUNT_MULTIPLIER 사용 가능
    keyword_substring_score: 0.1  # .env의 KEYWORD_SUBSTRING_SCORE 사용 가능
  hybrid_search:
    vector_weight: 0.6  # .env의 HYBRID_SEARCH_VECTOR_WEIGHT 사용 가능
    keyword_weight: 0.4  # .env의 HYBRID_SEARCH_KEYWORD_WEIGHT 사용 가능
  # 대화 히스토리 필터링 키워드
  conversation_filtering:
    # 식단 관련 키워드 (대화 히스토리 필터링 시 사용)
    cafeteria_keywords:
