# 워크플로우 vs 일반 요청 분류 프롬프트
# 사용자 요청을 워크플로우 실행 요청인지 일반 작업 요청인지 먼저 분류합니다.

request_classification:
  description: "사용자 요청을 워크플로우 실행 요청과 일반 작업 요청으로 분류"
  
  system_prompt: |
    사용자 질의를 분석하여 다음을 판단하세요:
    
    1. 이 질의가 **복합 워크플로우 실행 요청**인지
    2. 아니면 **일반 작업 요청**인지
    
    **워크플로우 실행 요청의 특징:**
    - 여러 단계의 작업을 순차적으로 자동으로 처리하는 복합 작업
    - 예 1 (출장/휴가): 일정 확인 → 문서 생성 → 이메일 설정 → 캘린더 등록
    - 예 2 (채용/면접): 이력서 검색 → 후보자 선택 → 면접관/일정 조율 → 안내 메일 발송 → 평가표 생성
    - 사용자가 실제로 새로운 작업을 시작하려는 의도
    - 구체적인 실행 동사: "다녀올게", "갈게", "신청하고 싶어", "준비해줘", "신청해줘" 등
    - 명령형이나 의지 표현: "~하고 싶어", "~해줘", "~할게"
    
    **일반 작업 요청의 특징:**
    - 단일 작업 또는 간단한 조회/수정/삭제 작업
    - 기존 작업을 변경/제거하는 요청 (취소, 삭제, 수정)
    - 정보 조회 요청 (알려줘, 보여줘, 조회해줘)
    - 질문형 요청 (방법은?, 규정은?, 어떻게 해야 해?)
    - 특정 대상/수신자에게 수행하는 **단일 액션**은 일반 작업:
      - 예: "메일 보내줘", "이메일 초안 작성해줘", "회의실 예약해줘", "문서 작성해줘" (다단계 처리 의도가 없을 때)
    
    **워크플로우 실행 요청 예시:**
    - "다음 주 3일간 제주도로 워크샵 다녀올게" → 워크플로우 (출장 신청 + 문서 + 이메일 + 캘린더)
    - "12월 20일부터 22일까지 부산 출장 갈게" → 워크플로우
    - "내일부터 3일간 휴가 신청하고 싶어" → 워크플로우
    - "출장 신청해줘" → 워크플로우
    - "휴가 다녀올게" → 워크플로우
    
    **일반 작업 요청 예시 (워크플로우 아님):**
    - "출장 일정 취소해줘" → 일반 작업 (취소 요청)
    - "출장 규정 알려줘" → 일반 작업 (정보 질문)
    - "휴가 신청 방법은?" → 일반 작업 (정보 질문)
    - "출장 일정 수정해줘" → 일반 작업 (수정 요청)
    - "출장 일정 삭제해줘" → 일반 작업 (삭제 요청)
    - "출장 신청서 양식 보여줘" → 일반 작업 (정보 요청)
    - "내일 연차 신청" → 일반 작업 (단일 작업)
    - "회의실 예약해줘" → 일반 작업 (단일 작업)
    - "이메일에서 육아휴직 관련 내용 찾아줘" → 일반 작업 (검색 요청)
    - "문서 작성해줘" → 일반 작업 (단일 작업)
    - "csu1940@gmail.com한테 오늘 야근 부탁한다고 메일 보내줘" → 일반 작업 (단일 이메일 발송/초안)
    - "csu1940@gmail.com한테 메일 보내줘" → 일반 작업 (단일 이메일 발송/초안)
    
    **판단 기준:**
    1. **취소/삭제/수정 동사 포함** → is_workflow_request = False (일반 작업)
    2. **질문형("알려줘", "방법은?", "규정은?", "어떻게 해야 해?")** → is_workflow_request = False (일반 작업)
    3. **정보 요청("보여줘", "찾아줘", "조회해줘")** → is_workflow_request = False (일반 작업)
    4. **단일 작업 요청** → is_workflow_request = False (일반 작업)
       - 특히 "메일/이메일" + "보내줘/작성해줘/초안" 같이 **이메일 단일 작업**이면 일반 작업
    5. **복합 워크플로우 실행 의도("다녀올게", "갈게", "신청하고 싶어", "신청해줘", "준비해줘")** → is_workflow_request = True
    6. **명령형 또는 의지 표현** → is_workflow_request = True (단, 취소/삭제/수정 동사 및 단일 이메일/단일 예약/단일 문서 요청은 제외)
    
    **중요 원칙:**
    - 취소/삭제/수정 요청은 **반드시** 일반 작업으로 분류
    - 정보 조회/질문 요청은 **반드시** 일반 작업으로 분류
    - 복합 워크플로우 실행 의도가 명확할 때만 워크플로우로 분류
    - 모호한 경우 일반 작업으로 분류 (안전한 선택)
    
    사용자 질의: "{query}"
    
    위 기준에 따라 판단하여 JSON 형식으로 응답하세요.
    is_workflow_request가 True이면 워크플로우 분류로 진행하고, False이면 일반 도메인 분류로 진행합니다.

  examples:
    workflow_requests:
      - "다음 주 3일간 제주도로 워크샵 다녀올게"
      - "12월 20일부터 22일까지 부산 출장 갈게"
      - "내일부터 3일간 휴가 신청하고 싶어"
      - "출장 신청해줘"
      - "휴가 다녀올게"
      - "프론트엔드 개발자 포지션 지원자 이력서 검토하고 면접 일정 잡아줘"
      - "백엔드 개발자 이력서 검색해서 면접 일정까지 잡아줘"
      - "채용 프로세스 시작해줘: 파이썬 개발자 검색부터 면접 안내까지"
      - "괜찮은 데이터 엔지니어 지원자 찾아서 면접 일정 잡아줘"
    
    general_requests:
      - "출장 일정 취소해줘"
      - "출장 규정 알려줘"
      - "휴가 신청 방법은?"
      - "출장 일정 수정해줘"
      - "출장 일정 삭제해줘"
      - "내일 연차 신청"
      - "회의실 예약해줘"
      - "미팅, 기모미팅, 내일 오후2시부터4시까지, 5명"  # ✅ 추가: 단순 회의실 예약 정보 제공
      - "이메일에서 육아휴직 관련 내용 찾아줘"
      - "문서 작성해줘"
      - "csu1940@gmail.com한테 오늘 야근을 부탁한다고 메일 보내줘"
      - "csu1940@gmail.com한테 메일 보내줘"
      - "오늘 식단 뭐야?"

