# 공통 프롬프트 설정 파일
# 오케스트레이터 및 공통 설정

supervisor:
  description: "최상위 오케스트레이터 - 사용자 요청을 분석하여 적절한 도메인으로 라우팅"
  architecture_features: |
    - Redis 기반 멀티턴 대화 지원: 모든 도메인에서 이전 대화 컨텍스트를 Redis에 저장하여 유지
    - Structured Output Parser: 사용자 쿼리에서 구조화된 파라미터를 추출하여 정확도 향상
    - Human-in-the-loop: 중요한 작업(연차 신청, 회의실 예약 등) 전 사용자 승인 요청
    - 서브그래프 구조: 각 도메인별 독립적인 에이전트와 워크플로우 관리
  classification_criteria: |
    사용자 질의를 분석하여 다음 도메인 중 하나로 분류:
    - schedule: 연차/반차/병가/경조사 신청, 회의실 예약, 일정 관리, 스케줄 조회 등 구체적인 액션 요청
    - document: 문서 작성, 보고서 작성, 템플릿 생성 등 문서 생성 관련
    - qa: Q&A, 질문, 문의, 메뉴얼, 복리후생 정책, 휴가규정, 근무제도, 급여 외 혜택, 회사 복지, 보험, 수당, 식단, 메뉴, 구내식당 관련
    - email: 이메일 검색, 이메일 답장문 생성 관련
    - tech: 특허, 논문, KISTI, ScienceON 관련
    - recruitment: 인재 추천, 이력서 검색, 지원자 검색, 채용 관련

orchestrator:
  description: "오케스트레이터 프롬프트 설정 - 도메인 분류 및 이전 대화 확인 질문 분류"
  prompts:
    history_check:
      system_prompt: |
        사용자 질의를 분석하여 이전 대화 확인 질문인지 판단하세요.

        **이전 대화 확인 질문의 특징:**
        - 사용자가 과거에 요청한 작업이나 대화 내용을 확인하는 질문
        - 예: "내가 이메일에서 육아휴직 관련 내용 찾아달라는 요청을 한적이 있어?"
        - 예: "이전에 특허 검색 요청한 적 있어?"
        - 예: "내가 연차 신청한 적 있어?"
        - 예: "문서 작성 요청했던 적 있어?"
        - 예: "인재 추천 요청한 적 있어?"

        **일반 질문과의 차이 (중요: 반드시 구분하세요):**
        - 일반 질문 (새로운 요청): "이메일에서 육아휴직 관련 내용 찾아줘" → **is_history_check=False**
        - 일반 질문 (새로운 요청): "이메일에서 육아휴직 정보 찾아줘" → **is_history_check=False**
        - 일반 질문 (새로운 요청): "내일 식단 알려줘" → **is_history_check=False**
        - 일반 질문 (새로운 요청): "제목: 연차 신청서 요구사항: 휴가 유형: 연차..." → **is_history_check=False** (문서 작성 요청)
        - 일반 질문 (새로운 요청): "연차 신청서 작성해줘" → **is_history_check=False** (문서 작성 요청)
        - 일반 질문 (새로운 요청): "휴가 신청서 만들어줘" → **is_history_check=False** (문서 작성 요청)
        - 확인 질문 (과거 요청 확인): "이메일에서 육아휴직 관련 내용 찾아달라고 요청한 적 있어?" → **is_history_check=True**
        - 확인 질문 (과거 요청 확인): "내가 육아휴직 관련 내용 찾아달라고 한적이 있어?" → **is_history_check=True**

        **이전 대화 확인 질문 판단 기준:**
        1. **과거형 확인 문구가 포함되어야 함**: "한적이 있어?", "한 적 있어?", "요청한 적 있어?", "했어?", "했었어?", "했나?", "했었나?", "했지?", "했었지?"
        2. **직접 요청 동사만 있는 경우는 False**: "찾아줘", "알려줘", "검색해줘", "보여줘", "작성해줘", "만들어줘" 등이 있고 확인 문구가 없으면 새로운 요청
        3. **문서 작성 요청 패턴은 항상 False**: "제목:", "요구사항:", "작성해줘", "만들어줘", "생성해줘" 같은 패턴이 있으면 새로운 요청
        4. **확실하지 않으면 False**: 모호한 경우 새로운 요청으로 처리

        **확인하려는 작업 유형 (is_history_check=True일 때만 설정):**
        - email_search: 이메일 검색 관련 (질문에 "이메일", "메일" 키워드 포함)
        - patent_search: 특허 검색 관련 (질문에 "특허" 키워드 포함)
        - article_search: 논문 검색 관련 (질문에 "논문", "paper", "article" 키워드 포함)
        - leave_request: 연차/휴가 신청 관련 (질문에 "연차", "휴가" 키워드 포함)
        - document_generation: 문서 생성 관련 (질문에 "문서 작성", "보고서 작성" 키워드 포함)
        - meeting_reservation: 회의실 예약 관련 (질문에 "회의실", "예약" 키워드 포함)
        - recruitment_search: 인재 추천/이력서 검색 관련 (질문에 "인재", "이력서", "채용" 키워드 포함)
        - 기타: 위에 해당하지 않는 경우

        **check_type 설정 주의사항:**
        - 질문 내용과 일치하는 작업 유형을 선택해야 함
        - 예: "이메일에서 찾아줘" → check_type은 email_search (article_search 아님)
        - 예: "논문 찾아줘" → check_type은 article_search
        - check_type이 질문 내용과 일치하지 않으면 신뢰도를 낮게 설정하세요

        {history_context}

        질의의 **주 목적**이 과거 요청이나 대화 내용을 확인하는 것인지 정확히 판단하세요.
      history_context_placeholder: "{history_context}"
    
    domain_classification:
      system_prompt: |
        사용자 질의를 분석하여 다음 도메인 중 하나로 분류하세요.

        **도메인 분류 기준 (문맥을 정확히 이해하여 분류하세요):**

        1. **email (이메일)**: 
           - "메일에서", "이메일에서", "메일함에서", "메일에서 찾아줘", "이메일 검색" 등의 표현이 포함된 경우
           - 이메일 검색, 이메일 답장문 생성 요청
           - **중요**: 질의에 "메일", "이메일", "메일함" 등의 키워드가 포함되어 있으면 반드시 email 도메인으로 분류하세요.

        2. **schedule (일정)**: 
           - 연차/반차/병가/경조사 신청, 회의실 예약, 회의실 추천, 회의실 조회, 일정 조회/관리
           - 출장/휴가 일정 조회, 출장/휴가 일정 취소/삭제/수정
           - **중요**: "회의실 추천해줘", "회의실 추천", "회의실 조회", "회의실 예약" 등 회의실 관련 요청은 반드시 schedule 도메인으로 분류
           - **중요**: "추천"이라는 키워드가 있어도 "회의실 추천"이면 schedule, "식단 추천"이면 qa로 분류하세요
           - **중요**: "출장 일정 취소해줘", "휴가 일정 삭제해줘", "출장 일정 수정해줘" 같은 취소/삭제/수정 요청도 schedule 도메인으로 분류
           - **주의**: "문서 검토 일정", "문서 확인 일정" 같이 "문서"라는 단어가 있어도 일정 조회가 주 목적이면 schedule로 분류
           - **주의**: 출장/휴가 신청("출장 신청해줘", "휴가 다녀올게")은 워크플로우로 처리될 수 있지만, 취소/삭제/수정은 일반 schedule 작업

        3. **document (문서)**: 
           - 문서 작성, 보고서 작성, 템플릿 생성 요청
           - "문서 작성해줘", "보고서 작성", "양식:", "template:", "제품개발 계획서" 등
           - **신청서 작성**: "휴가 신청서", "연차 신청서", "반차 신청서", "병가 신청서", "경조사 신청서", "신청서 작성", "신청서 만들어줘" 등은 반드시 document로 분류
           - **중요**: "휴가 신청서 작성해줘", "연차 신청서 만들어줘" 같은 신청서 작성 요청은 document로 분류 (recruitment가 아님)
           - **중요**: "문서 작성해줘. 일정: ..." 같은 경우도 document로 분류 (문서 작성이 주 목적, 일정은 문서 내용의 일부)
           - **주의**: "이력서 작성해줘"는 recruitment로 분류하되, "휴가 신청서", "연차 신청서" 등 다른 신청서는 document로 분류

        4. **qa (질문/문의)**: 
           - Q&A, 질문, 문의, 메뉴얼, 복리후생 정책 관련
           - **메뉴얼 관련**: "메뉴얼에서", "매뉴얼에서", "메뉴얼", "매뉴얼", "manual" 등의 키워드가 있으면 무조건 qa로 분류
           - 예: "메뉴얼에서 연차 정보 알려줘", "우리 회사 메뉴얼에서 연차사용 정보 알려줘", "매뉴얼 보여줘"
           - **식단/메뉴 관련**: 식단 조회, 메뉴 조회, 구내식당, 점심/저녁 메뉴, 다이어트 식단, 식단 추천 등
           - 예: "오늘 식단 뭐야?", "내일 점심 메뉴 알려줘", "다이어트 중인데 내일 식단을 어떻게 먹어야해?", "구내식당 메뉴 조회"
           - **중요**: "메뉴얼에서"와 "메일에서"를 구분하세요. "메뉴얼에서"는 qa, "메일에서"는 email입니다.
           - **주의**: "메일에서", "이메일에서" 같은 표현이 있으면 qa가 아닌 email로 분류해야 합니다.
           - **주의**: "내일 식단"처럼 날짜가 포함되어 있어도 식단 조회가 주 목적이면 qa로 분류 (schedule이 아님)

        5. **tech (기술 검색)**: 
           - 특허, 논문, KISTI, ScienceON 관련 검색 요청
           - **중요**: 이전 대화에서 "검색 방식을 선택해주세요" 또는 "서버 기반 검색" 또는 "웹 검색" 같은 질문이 있었고, 현재 입력이 "서버에서", "서버", "웹에서", "웹", "1", "2" 같은 짧은 답변이면 반드시 tech 도메인으로 분류하세요.
           - 예: 이전 대화에 "검색 방식을 선택해주세요"가 있고, 현재 입력이 "서버에서" → tech
           - 예: 이전 대화에 "검색 방식을 선택해주세요"가 있고, 현재 입력이 "웹" → tech
           - **중요**: 이전 대화 내용에서 논문 검색 결과가 있었고, 사용자가 "3번 논문", "1번 논문" 같은 순번을 언급하면 반드시 tech 도메인으로 분류하세요.
           - **중요**: 이전 대화 내용에서 논문/특허에 대한 답변이 있고, 사용지기 "결론", "요약", "설명", "요약해줘", "알려줘" 혹은 언급된 개념, 용어, 키워드에 대해 질문같은 후속 질문을 하면 tech 도메인으로 분류하세요.
           - **중요**: 이전 대화 내용에서 논문/특허 검색 결과가 있었고, 사용자가 "1번", "2번", "3번" 같은 순번과 함께 "다운로드", "다운로드 받아줘", "PDF 다운로드" 같은 표현을 사용하면 tech 도메인으로 분류하세요.
            - **중요**: "번호 + 자세히/상세히/제대로 같은 패턴이 있고 이전 대화에서 특허/논문 검색 결과가 있었으면 반드시 tech 도메인으로 분류하세요.

        6. **recruitment (채용)**: 
           - 인재 추천, 이력서 검색, 지원자 검색, 채용 관련
           - "인재 추천해줘", "Python 개발자 추천", "이력서 검색", "지원자 찾아줘", "채용", "인재 채용" 등
           - **중요**: "인재", "이력서", "지원자", "채용", "추천" 등의 키워드가 있고 채용 맥락이면 recruitment로 분류
           - **주의**: "이력서 작성해줘" 같은 문서 작성 요청은 document가 아니라 recruitment로 분류 (채용 프로세스의 일부)
           - **중요**: "휴가 신청서", "연차 신청서", "반차 신청서" 등은 recruitment가 아닌 document로 분류 (신청서 작성은 document 도메인)
           - **중요**: 이전 대화 내용({context})에서 인재 추천/이력서 검색 결과가 있었고, 사용자가 "1번", "2번", "3번" 같은 순번과 함께 "요약", "자세히", "상세", "알려줘" 같은 표현을 사용하면 반드시 recruitment 도메인으로 분류하세요.
           - 예: 이전 대화에 "Python 개발자 인재 추천해줘" → 5명 추천 결과 표시 → "2번 요약해줘" → recruitment
           - 예: 이전 대화에 "이력서 검색해줘" → 검색 결과 표시 → "1번 자세히" → recruitment

        **분류 예시:**
        - "문서 작성해줘. 양식: 제품개발 계획서. 일정: Q1, Q2 포함" → document (문서 작성이 주 목적)
        - "문서 검토 일정 알려줘" → schedule (일정 조회가 주 목적)
        - "문서 작성해줘. 문서 검토 일정도 포함해줘" → document (문서 작성이 주 목적)
        - "내일 연차 신청" → schedule (연차 신청)
        - "회의실 추천해줘" → schedule (회의실 추천)
        - "회의실 조회해줘" → schedule (회의실 조회)
        - "회의실 예약해줘" → schedule (회의실 예약)
        - "문서 목록 보여줘" → document (문서 조회)
        - "휴가 신청서 작성해줘" → document (신청서 작성)
        - "연차 신청서 만들어줘" → document (신청서 작성)
        - "반차 신청서 생성" → document (신청서 작성)
        - "다이어트 중인데 내일 식단을 어떻게 먹어야해?" → qa (식단 조회가 주 목적, "내일"은 날짜 정보일 뿐)
        - "오늘 식단 뭐야?" → qa (식단 조회)
        - "내일 점심 메뉴 알려줘" → qa (식단 조회)
        - "구내식당 메뉴 조회" → qa (식단 조회)
        - "Python 개발자 인재 추천해줘" → recruitment (인재 추천)
        - "이력서 검색해줘" → recruitment (이력서 검색)
        - "1번 인재 요약해줘" → recruitment (이전 추천 결과의 상세 조회)

        **분류 원칙:**
        - 질의의 **주 목적**을 파악하여 분류하세요
        - 키워드가 여러 개 있어도 주 목적이 무엇인지 판단하세요
        - 문맥을 고려하여 정확하게 분류하세요
        - **특히 이전 대화 내용({context})을 반드시 확인하여, 특허 검색 모드 선택 질문에 대한 답변인지 먼저 판단하세요.**

        {context}
      context_placeholder: "{context}"
  important_rules:
    - '"이메일 자동응답", "메일 자동응답" 같은 이메일 답장문 생성은 email로 분류'
    - '"휴가·근무제도에 대해 알려줘", "급여 외 혜택에 대해 알려줘" 같은 정책/제도 질문은 qa로 분류'
    - '"이메일에서 ... 찾아줘", "메일에서 ... 찾아줘" 같은 이메일 검색은 email로 분류'
    - '숫자로 시작하는 질문은 이전 검색 결과의 상세 요청일 가능성이 높음 (이전 도메인 확인 필요)'
    - '"승인", "확인", "네", "예" 같은 단순 응답은 Human-in-the-loop 승인 요청에 대한 응답일 수 있음 (이전 도메인 확인 필요)'
    - '"웹 검색", "사내 검색" 같은 단순 응답은 이전 검색의 연속 요청일 수 있음 (이전 도메인 확인 필요)'
    - '"3번", "1번", "2번째", "4" 같은 순번 패턴이 있고 이전 대화에서 논문/특허 검색 결과가 있었으면 이전 검색의 연속 요청일 수 있음 (이전 도메인 확인 필요)'
    - '"결론", "요약", "설명", "요약해줘", "알려줘" 같은 후속 질문이 있고 이전 대화에서 논문/특허에 대한 답변이 있었으면 tech 도메인으로 분류 (이전 도메인 확인 필요)'
    - '이전 대화에서 논문/특허에 대한 답변이 있었고, 사용자가 논문에서 언급된 개념, 용어, 키워드에 대해 질문하면 tech 도메인으로 분류 (이전 도메인 확인 필요)'
    - '명시적 키워드("논문", "특허", "메일" 등)가 있으면 이전 컨텍스트보다 우선하여 새로운 요청으로 처리'
    - '"다운로드", "다운로드 받아줘" 같은 표현이 이전 검색 결과의 상세 요청일 가능성이 높음 (이전 도메인 확인 필요)'
    - '"인재 추천", "이력서 검색", "지원자 찾아줘" 같은 채용 관련 요청은 recruitment로 분류'
    - '"휴가 신청서", "연차 신청서", "반차 신청서", "병가 신청서", "경조사 신청서" 같은 신청서 작성 요청은 document로 분류 (recruitment가 아님)'
    - '"신청서 작성해줘", "신청서 만들어줘" 같은 요청은 document로 분류'
  output_format: '{"route": "schedule|document|qa|email|tech|recruitment|unknown"}'

orchestrator_config:
  date_time:
    weekday_names:
      - "월요일"
      - "화요일"
      - "수요일"
      - "목요일"
      - "금요일"
      - "토요일"
      - "일요일"
    date_format: "%Y년 %m월 %d일"
    time_format: "%H시 %M분"
  keywords:
    strong_history_keywords:
      - "요청한적"
      - "요청한 적"
      - "요청했어"
      - "요청했었어"
      - "요청한적있어"
      - "요청한 적 있어"
      - "한적"
      - "한 적"
      - "했어?"
      - "했었어?"
      - "했나?"
      - "했었나?"
      - "찾아달라고 요청"
      - "검색 요청한적"
      - "검색한적"
      - "검색한 적"
      - "찾아달라는 요청"
      - "요청했던"
      - "요청했었던"
      - "이전에"
      - "전에"
      - "아까"
      - "지금까지"
      - "지금껏"
    weak_history_keywords:
      - "했어"
      - "했나"
      - "했었어"
      - "했었나"
      - "했지"
      - "했었지"
    tech_continuation_keywords:
      - "웹에서"
      - "웹에서 검색"
      - "웹 검색"
      - "웹검색"
      - "사내 서버"
      - "사내 서버에서"
      - "사내 서버에서 검색"
      - "사내 검색"
      - "1"
      - "2"
      - "1번"
      - "2번"
      - "웹"
      - "사내"
    server_data_keywords:  # 특허 검색 관련 서버 데이터 질문 키워드
      - "서버에"
      - "서버에 데이터"
      - "데이터가 있나"
      - "데이터 있나"
      - "서버에 있나"
      - "서버에 있는지"
      - "데이터 있는지"
      - "서버"
      - "벡터"
      - "db"
      - "데이터베이스"
      - "밀버스"
  search_params:
    history_check_recent_messages: 3
    history_check_message_max_length: 200
    domain_classification_recent_messages: 2
    domain_classification_message_max_length: 100
    conversation_history_max_messages: 20  # 이전 대화 확인 시 검색할 최대 메시지 수
    email_results_max_count: 5
    query_preview_length: 50
    simple_selection_max_length: 3
    # 이전 대화 확인 질문 분류 설정
    history_check:
      confidence_threshold: 0.85  # 신뢰도가 이 값보다 낮으면 일반 요청으로 처리
    simple_selection_keywords:
      - "네"
      - "예"
      - "아니오"
      - "아니"
      - "1번"
      - "2번"
      - "1"
      - "2"
    # 이전 대화 확인 질문 처리용 키워드 매칭 설정
    history_check_matching:
      # 키워드 추출 패턴
      keyword_pattern: "([가-힣a-zA-Z]+)\\s*(?:관련|관해서|에 대해|에 대한|내용)"
      # 질문에서 직접 추출할 키워드 매핑
      query_keyword_mapping:
        email:
          - "이메일"
          - "메일"
        qa:
          - "식단"
          - "메뉴"
          - "구내식당"
        recruitment:
          - "인재"
          - "이력서"
          - "채용"
          - "지원자"
          - "추천"
        # QA 구체적 키워드 (복리후생, 연차사용 등)
        qa_specific:
          - "복리후생"
          - "연차사용"
          - "연차"
          - "휴가규정"
          - "근무제도"
          - "보험"
          - "수당"
          - "육아휴직"
          - "출산휴가"
          - "메뉴얼"
          - "매뉴얼"
          - "manual"
      # 이전 요청 타입별 검색 키워드
      request_type_keywords:
        email:
          search_verbs:
            - "찾아"
            - "검색"
            - "찾아줘"
            - "검색해줘"
        qa:
          keywords:
            - "식단"
            - "메뉴"
            - "구내식당"
        recruitment:
          keywords:
            - "인재"
            - "이력서"
            - "채용"
            - "지원자"
            - "추천"
          search_verbs:
            - "추천"
            - "검색"
            - "찾아"
            - "추천해줘"
            - "검색해줘"
            - "찾아줘"
            - "복리후생"
            - "연차사용"
            - "연차"
            - "휴가규정"
            - "근무제도"
            - "보험"
            - "수당"
            - "육아휴직"
            - "출산휴가"
      # 점수 계산 가중치
      scoring_weights:
        base_score: 10  # 기본 매칭 점수
        type_match_bonus: 20  # 타입 일치 보너스 (질문에서 "이메일" 언급 + 이전 요청도 이메일)
        keyword_match_bonus: 15  # 키워드 매칭 보너스 (질문의 키워드가 이전 요청에 포함)
        exact_keyword_match_bonus: 25  # 정확한 키워드 일치 보너스 (추출된 키워드가 질문 키워드와 정확히 일치)
        domain_type_match_bonus: 30  # 도메인 타입 일치 보너스 (질문의 도메인 타입과 이전 요청의 도메인 타입이 일치)
        all_keywords_match_multiplier: 2  # 모든 키워드 일치 보너스 배수 (exact_keyword_match_bonus * multiplier)
      # 키워드 매칭 설정
      keyword_matching:
        min_keyword_length: 2  # 키워드 최소 길이 (이 길이 이상인 키워드만 매칭에 사용)
        max_candidate_messages: 5  # 이전 답변 찾을 때 확인할 최대 메시지 수
        exclude_history_check_patterns:  # 이전 대화 확인 질문 패턴 (답변에서 제외)
          - "이전에"
          - "요청하신 적"
          - "요청한 적"
          - "한적이"
      # 정규식 패턴
      regex_patterns:
        email_doc_number: "\\d{11,}MAB\\d+-\\d+"  # 이메일 문서번호 패턴
        email_title: "\\*\\*\\[([^\\]]+)\\]\\*\\*"  # 이메일 제목 추출 패턴
      # 응답 메시지 설정
      response_messages:
        no_previous_request: "아니요, 이전에 {request_type} 요청은 없었습니다."
        no_email_search: "아니요, 이전에 이메일에서 검색/찾기 요청은 없었습니다."
        previous_qa_request: "네, 이전에 '{keywords}' 관련 내용을 요청하신 적이 있습니다."
        previous_email_request: "네, 이전에 '{keywords}' 관련 내용을 이메일에서 찾아달라는 요청을 하신 적이 있습니다."
        previous_generic_request: "네, 이전에 '{keywords}' 관련 요청을 하신 적이 있습니다."
        previous_generic_search: "네, 이전에 검색/찾기 요청을 하신 적이 있습니다."
        previous_qa_menu: "네, 이전에 식단/메뉴 관련 요청을 하신 적이 있습니다."
        previous_email_search: "네, 이전에 이메일에서 검색/찾기 요청을 하신 적이 있습니다."
        previous_recruitment_request: "네, 이전에 '{keywords}' 관련 인재 추천/이력서 검색 요청을 하신 적이 있습니다."
        previous_recruitment_search: "네, 이전에 인재 추천/이력서 검색 요청을 하신 적이 있습니다."
        more_email_help: "\n더 많은 메일을 검색하거나 특정 메일의 상세 내용을 원하신다면 말씀해 주세요! 😊"
      # 체크 타입 매핑
      check_type_mapping:
        email_search: "이메일 검색"
        patent_search: "특허 검색"
        article_search: "논문 검색"
        leave_request: "연차/휴가 신청"
        document_generation: "문서 생성"
        meeting_reservation: "회의실 예약"
        recruitment_search: "인재 추천/이력서 검색"
    # Tech 도메인 관련 설정
    tech_domain:
      # 서버 데이터 질문 감지 키워드
      server_data_keywords:
        - "서버에"
        - "서버에 데이터"
        - "데이터가 있나"
        - "데이터 있나"
        - "서버에 있나"
        - "서버에 있는지"
        - "데이터 있는지"
        - "서버"
        - "벡터"
        - "db"
        - "데이터베이스"
        - "밀버스"
    # 라우팅 설정
    routing:
      # Fallback 도메인 설정
      fallback_domain: "qa"  # 알 수 없는 도메인일 때 기본 도메인
      fallback_domain_on_empty: "document"  # domain이 없을 때 기본 도메인
      # 도메인별 기본 완료 메시지
      domain_completion_messages:
        schedule: "스케줄 작업을 완료했습니다."
        document: "문서 작업을 완료했습니다."
        qa: "질문에 답변했습니다."
        email: "이메일 작업을 완료했습니다."
        tech: "기술 검색 작업을 완료했습니다."
        recruitment: "채용 작업을 완료했습니다."

