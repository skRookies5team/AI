qa:
  description: "Q&A 도메인 - 질문 답변 및 조회"
  features: |
    - Redis 기반 컨텍스트 관리: 이전 검색 쿼리, 답변, 검색된 문서 컨텍스트 등을 Redis에 저장하여 멀티턴 대화 지원
    - RAG (Retrieval-Augmented Generation): Milvus 벡터 DB를 활용한 하이브리드 검색
    - 대화 히스토리 활용: conversation_history를 LLM 프롬프트에 포함하여 자연스러운 대화 지원
  sub_agents:
    manual:
      description: "매뉴얼 검색 (RAG)"
      capabilities:
        - "매뉴얼 검색"
        - "Q&A 검색"
        - "일반 질문 답변"
      keywords:
        positive:
          - "메뉴얼"
          - "Q&A"
          - "질문"
          - "문의"
          - "어떻게"
          - "방법"
        negative:
          - "식단"
          - "메뉴"
          - "구내식당"
          - "복리후생"
          - "보험"
      examples:
        - "시스템 사용 방법 알려줘"
        - "로그인 오류 해결 방법"
    benefit:
      description: "복리후생 조회"
      capabilities:
        - "복리후생 정책 조회"
        - "휴가규정 안내"
        - "근무제도 안내"
        - "급여 외 혜택 조회"
        - "보험 정보 조회"
        - "수당 정보 조회"
        - "퇴직연금 정보 조회"
      keywords:
        positive:
          - "복리후생"
          - "휴가규정"
          - "근무제도"
          - "급여 외 혜택"
          - "복지"
          - "보험"
          - "수당"
          - "퇴직연금"
          - "육아휴직"
          - "출산휴가"
        negative:
          - "이메일"
          - "메일"
          - "숫자로 시작"  # 숫자로 시작하면 이메일 상세 요청일 가능성
      examples:
        - "육아휴직 신청 방법 알려줘"
        - "복리후생 정책 보여줘"
        - "출산휴가 규정 알려줘"
    menu:
      description: "식단 조회"
      capabilities:
        - "오늘 식단 조회"
        - "특정 날짜 식단 조회"
        - "구내식당 메뉴 조회"
      keywords:
        positive:
          - "식단"
          - "메뉴"
          - "구내식당"
          - "점심"
          - "저녁"
          - "오늘"
          - "내일"
        negative: []
      examples:
        - "오늘 구내식당 메뉴 뭐야?"
        - "내일 점심 식단 알려줘"
    recommend:
      description: "메뉴 추천"
      capabilities:
        - "식단 기반 메뉴 추천"
        - "다이어트 메뉴 추천"
        - "건강 메뉴 추천"
      keywords:
        positive:
          - "추천"
          - "다이어트"
          - "뭐 먹을까"
          - "먹어야"
          - "어떻게"
        negative: []
      examples:
        - "다이어트 메뉴 추천해줘"
        - "점심에 뭐 먹을까?"
  classification_criteria: |
    사용자 질의를 분석하여 다음 QA 서브 에이전트 중 하나로 분류:
    - manual: 메뉴얼, Q&A, 질문, 문의 관련 (위 카테고리에 해당하지 않는 경우)
    - benefit: 복리후생, 휴가규정, 근무제도, 급여 외 혜택, 복지, 보험, 수당, 퇴직연금, 회사 복지 정책 관련
    - menu: 식단, 메뉴, 구내식당, 점심, 저녁 관련
    - recommend: 식단 추천, 다이어트 메뉴 추천 관련
    - email: 이메일/메일 검색, 찾기 관련 (참고: 실제로는 email 도메인으로 라우팅)
    
    주의사항:
    - 숫자로 시작하는 질문은 이메일 검색 결과의 상세 요청일 가능성이 매우 높음
    - 예: "938. [고용보험]육아휴직...에 대해 알려줘" -> email로 분류
    - '"에 대해 알려줘", "자세히", "상세히" 같은 키워드가 있고 숫자로 시작하면 email로 분류'
  output_format: '{"intent": "manual|benefit|menu|recommend|email"}'

email:
  description: "이메일 도메인 - 이메일 검색/작성/분석"
  features: |
    - Redis 기반 컨텍스트 관리: 검색된 이메일 ID 목록, 배치 오프셋, 마지막 검색 키워드 등을 Redis에 저장
    - Structured Output Parser: 이메일 검색 시 keywords, from_address, date_range 등을 구조화된 형식으로 추출
    - 멀티턴 대화: "더 찾아줘" 요청 시 이전 검색 컨텍스트를 활용하여 연속 검색 지원
  sub_agents:
    search:
      description: "이메일 검색"
      capabilities:
        - "키워드 기반 이메일 검색"
        - "발신자별 이메일 검색"
        - "날짜 범위 이메일 검색"
        - "이메일 상세 조회"
      keywords:
        positive:
          - "이메일"
          - "메일"
          - "찾아"
          - "검색"
          - "최근"
          - "받은"
        negative: []
      examples:
        - "육아휴직 관련 이메일 찾아줘"
        - "최근 받은 메일 알려줘"
        - "938번 이메일 상세 보여줘"
      important_rules:
        - '숫자로 시작하는 질문은 이메일 검색 결과의 상세 요청일 가능성이 매우 높음'
        - '예: "938. [고용보험]육아휴직...에 대해 알려줘" -> search로 분류'
        - '패턴: "숫자. 제목에 대해 알려줘", "숫자번 상세", "숫자번에 대해" -> 모두 search로 분류'
    auto_reply:
      description: "이메일 답장문 생성"
      capabilities:
        - "이메일 자동응답 생성"
        - "답장 초안 작성"
        - "회신 메시지 작성"
      keywords:
        positive:
          - "이메일 자동응답"
          - "메일 자동응답"
          - "답장"
          - "응답"
          - "회신"
          - "작성"
        negative:
          - "이메일에서 ... 찾아줘"  # 검색은 search로
          - "메일에서 ... 찾아줘"
      examples:
        - "이메일 답장 작성해줘"
        - "자동응답 메시지 만들어줘"
  classification_criteria: |
    사용자 질의를 분석하여 다음 이메일 서브 에이전트 중 하나로 분류:
    - search: 이메일/메일 검색, 찾기 관련
    - auto_reply: 이메일 답장문 생성, 자동응답 생성 관련
  output_format: '{"intent": "search|auto_reply"}'

