  classification_criteria: |
    사용자 질의를 분석하여 다음 QA 서브 에이전트 중 하나로 분류:
    
    **우선순위 규칙 (중요):**
    1. "메뉴얼", "매뉴얼", "manual", "사용 방법", "가이드", "안내", "Q&A", "FAQ" 등의 키워드가 **명시적으로** 있으면 **무조건 manual**로 분류
    2. "식단", "메뉴", "구내식당", "점심", "저녁" 등의 키워드가 있으면 menu 또는 recommend로 분류
    3. "복리후생" 키워드가 있으면 **메뉴얼 키워드가 없을 때** benefit으로 분류 (복리후생이 가장 우선)
    4. 위에 해당하지 않고 "휴가규정", "근무제도", "보험", "수당", "연차사용", "연차" 등의 키워드가 있으면 benefit으로 분류
    
    **분류 기준:**
    - manual: 메뉴얼, 매뉴얼, manual, Q&A, FAQ, 질문, 문의, 사용 방법, 가이드, 안내, 정책, 규정, 절차, 지침 관련
      * **중요**: "연차사용 메뉴얼", "휴가규정 메뉴얼", "복리후생 메뉴얼"처럼 다른 키워드와 함께 있어도 "메뉴얼" 키워드가 있으면 무조건 manual로 분류
      * 예: "우리회사 연차사용 메뉴얼 알려줘" -> manual (연차가 포함되어 있어도 메뉴얼이 우선)
      * 예: "휴가규정 메뉴얼 보여줘" -> manual
      * 예: "복리후생 정책 메뉴얼 알려줘" -> manual
    - benefit: 복리후생, 휴가규정, 근무제도, 급여 외 혜택, 복지, 보험, 수당, 퇴직연금, 회사 복지 정책, 연차사용, 연차 관련
      * **중요**: "복리후생" 키워드가 있으면 "메뉴얼" 키워드가 없을 때 무조건 benefit으로 분류
      * **주의**: "연차사용", "연차" 키워드가 있어도 "복리후생" 키워드가 함께 있으면 benefit으로 분류
      * 예: "우리 회사 복리후생에서 연차사용 정보 알려줘" -> benefit (복리후생 키워드가 있으므로)
      * 예: "복리후생에서 연차 관련 정보 알려줘" -> benefit (복리후생 키워드가 있으므로)
      * 예: "육아휴직 신청 방법 알려줘" -> benefit (메뉴얼 키워드 없음)
      * 예: "복리후생 정책 알려줘" -> benefit (메뉴얼 키워드 없음)
    - menu: 식단, 메뉴, 구내식당, 점심, 저녁 관련
    - recommend: 식단 추천, 다이어트 메뉴 추천 관련
    - email: 이메일/메일 검색, 찾기 관련 (참고: 실제로는 email 도메인으로 라우팅)
    
    **주의사항:**
    - 숫자로 시작하는 질문은 이메일 검색 결과의 상세 요청일 가능성이 매우 높음
    - 예: "938. [고용보험]육아휴직...에 대해 알려줘" -> email로 분류
    - '"에 대해 알려줘", "자세히", "상세히" 같은 키워드가 있고 숫자로 시작하면 email로 분류'
    - **"메뉴얼" 키워드가 있으면 다른 키워드(연차, 휴가, 복리후생 등)보다 우선하여 manual로 분류**
  output_format: '{"intent": "manual|benefit|menu|recommend|email"}'

email:
  description: "이메일 도메인 - 이메일 검색/작성/분석"
  features: |
    - Redis 기반 컨텍스트 관리: 검색된 이메일 ID 목록, 배치 오프셋, 마지막 검색 키워드 등을 Redis에 저장
    - Structured Output Parser: 이메일 검색 시 keywords, from_address, date_range 등을 구조화된 형식으로 추출
    - 멀티턴 대화: "더 찾아줘" 요청 시 이전 검색 컨텍스트를 활용하여 연속 검색 지원
  sub_agents:
    search:
      description: "이메일 검색"
      capabilities:
        - "키워드 기반 이메일 검색"
        - "발신자별 이메일 검색"
        - "날짜 범위 이메일 검색"
        - "이메일 상세 조회"
      keywords:
        positive:
          - "이메일"
          - "메일"
          - "찾아"
          - "검색"
          - "최근"
          - "받은"
        negative: []
      examples:
        - "육아휴직 관련 이메일 찾아줘"
        - "최근 받은 메일 알려줘"
        - "938번 이메일 상세 보여줘"
      important_rules:
        - '숫자로 시작하는 질문은 이메일 검색 결과의 상세 요청일 가능성이 매우 높음'
        - '예: "938. [고용보험]육아휴직...에 대해 알려줘" -> search로 분류'
        - '패턴: "숫자. 제목에 대해 알려줘", "숫자번 상세", "숫자번에 대해" -> 모두 search로 분류'
    auto_reply:
      description: "이메일 답장문 생성"
      capabilities:
        - "이메일 자동응답 생성"
        - "답장 초안 작성"
        - "회신 메시지 작성"
      keywords:
        positive:
          - "이메일 자동응답"
          - "메일 자동응답"
          - "답장"
          - "응답"
          - "회신"
          - "작성"
        negative:
          - "이메일에서 ... 찾아줘"  # 검색은 search로
          - "메일에서 ... 찾아줘"
      examples:
        - "이메일 답장 작성해줘"
        - "자동응답 메시지 만들어줘"
  classification_criteria: |
    사용자 질의를 분석하여 다음 이메일 서브 에이전트 중 하나로 분류:
    - search: 이메일/메일 검색, 찾기 관련
    - auto_reply: 이메일 답장문 생성, 자동응답 생성 관련
  output_format: '{"intent": "search|auto_reply"}'

tech:
  description: "기술 도메인 - 특허/논문 검색"
  features: |
    - Redis 기반 컨텍스트 관리: 검색 결과, 마지막 검색 키워드, 표시된 결과 개수 등을 Redis에 저장하여 멀티턴 대화 지원
    - 검색 소스 선택: 웹 검색 또는 사내 서버 검색 선택 지원
    - 대화식 응답: 이전 검색 결과에 대한 질문 시 새로운 검색 없이 대화식으로 응답
  sub_agents:
    patent:
      description: "특허 검색"
      capabilities:
        - "특허 검색"
        - "특허 상세 정보 조회"
        - "특허 벡터화 (선택적)"
      keywords:
        positive:
          - "특허"
          - "patent"
          - "Patent"
        negative: []
      examples:
        - "스마트워치 특허 검색해줘"
        - "AI 관련 특허 찾아줘"
      search_mode_classification_criteria: |
        사용자의 검색 모드 선택을 분석하여 분류하세요:
        
        - server: "1", "1번", "서버", "벡터", "db", "데이터베이스", "내부", "사내" 등
          예시: "내부 데이터에서 찾아볼래", "벡터DB에서 검색", "사내 서버에서"
        
        - web: "2", "2번", "웹", "kipris", "인터넷", "온라인" 등
          예시: "인터넷에서 찾아볼래", "웹에서 검색해줘", "KIPRIS에서 검색"
      yes_no_classification_criteria: |
        사용자의 예/아니오 답변을 분석하여 분류하세요:
        
        - yes: "네", "예", "좋아", "해줘", "그래", "좋아요", "진행해줘", "해볼래", "해볼게" 등
        - no: "아니오", "아니", "안해", "필요없어", "괜찮아", "안 할게요", "안해도 돼" 등
      web_search_question_prompt: |
        사용자가 서버 기반 검색을 요청했지만, 서버에 해당 키워드와 관련된 특허 자료가 저장되어 있지 않은 상황입니다.
        
        다음 정보를 바탕으로 사용자에게 자연스럽고 친절하게 웹 검색을 제안하는 질문을 생성하세요:
        
        - 사용자 검색어: "{keyword}"
        - 검색 모드: 서버 기반 검색 (벡터DB)
        - 상황: 서버에 저장된 자료가 없음
        
        질문 생성 시 다음 사항을 고려하세요:
        1. 사용자의 검색 의도를 존중하며, 서버에 자료가 없다는 것을 명확히 전달
        2. 웹 검색의 장점(광범위한 검색, 최신 정보)을 간단히 언급
        3. 사용자가 쉽게 답변할 수 있도록 명확한 선택지를 제시
        4. 친절하고 도움이 되는 톤 유지
        
        예시:
        - "서버에 '{keyword}' 관련 특허 자료가 저장되어 있지 않습니다. 웹에서 찾아드릴까요?"
        - "안타깝게도 서버에 '{keyword}' 관련 특허가 없습니다. KIPRIS 웹 검색으로 더 많은 정보를 찾아드릴 수 있습니다. 진행할까요?"
        
        질문만 생성하세요 (추가 설명 없이).
      search_mode_response_detection_prompt: |
        대화 히스토리와 현재 사용자 입력을 분석하여 특허 검색 모드 선택 응답인지 판단하세요.
        
        **분석 조건:**
        1. 이전 대화에 특허 검색 관련 질문이 있었는지 (예: "특허 찾아줘", "특허 검색")
        2. 이전 대화에 "검색 방식을 선택해주세요" 또는 "서버 기반 검색", "웹 검색" 같은 질문이 있었는지
        3. 현재 사용자 입력이 그 질문에 대한 응답인지
        
        **검색 모드 선택 응답의 예시:**
        - "내부 데이터에서 찾아볼래" → server 모드 선택
        - "서버에서 검색해줘" → server 모드 선택
        - "회사 내부에 있나" → server 모드 선택 (서버 데이터 확인 질문)
        - "내부에 있나" → server 모드 선택 (서버 데이터 확인 질문)
        - "인터넷에서 찾아줘" → web 모드 선택
        - "웹 검색해줘" → web 모드 선택
        - "1" 또는 "1번" → server 모드 선택
        - "2" 또는 "2번" → web 모드 선택
        - "내부 데이터" → server 모드 선택
        - "서버에 있나" → server 모드 선택 (서버 데이터 확인 질문)
        
        **일반 질문과의 차이:**
        - 검색 모드 선택 응답: 이전에 "검색 방식을 선택해주세요" 질문이 있었고, 그에 대한 응답
        - 일반 질문: 특허 검색과 관련 없는 새로운 질문
        
        **대화 히스토리:**
        {history_context}
        
        **현재 사용자 입력:**
        {user_query}
        
        JSON 형식으로만 응답:
        {{
          "is_search_mode_response": true 또는 false,
          "search_mode": "server" 또는 "web" 또는 null,
          "confidence": 0.0 ~ 1.0
        }}
        
        is_search_mode_response가 true이고 confidence가 0.7 이상이면 tech 도메인으로 유지해야 합니다.
      keyword_generation:
        description: "사용자 질의를 특허 검색용 핵심 키워드로 변환"
        prompt: |
          다음 사용자 질의를 특허 검색용 핵심 키워드로 요약해줘.
          - 출력 형식: 쉼표로 구분된 최대 3개의 키워드만 반환해.
          - 모든 키워드는 무조건 사용자 입력에 존재하는 단어로만 선택해.
          - 각 키워드는 1~2개의 핵심 단어로 구성하고, 질문에 등장한 핵심 개념에서만 선택해.
          - '특허', 'Patent', '검색', '찾아', '알려', '줘', '주세요', '관련', '정보' 같은 일반 단어와 조사는 모두 제거해.
          - 번호, 설명, 불릿, 접두어 같은 추가 문장은 절대 포함하지 마.
          - 예시 입력: '배터리 충전 관련 특허 찾아줘' -> 예시 출력: 배터리, 충전
          - 예시 입력: 'AI 딥러닝 특허' -> 예시 출력: 인공지능, 딥러닝
          입력: {user_input}
