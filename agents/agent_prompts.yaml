          - 출력 형식: 쉼표로 구분된 최대 3개의 키워드만 반환해.
          - 핵심 기술 용어만 선택하고, 일반적인 단어는 제거해.
          - 예시 입력: '배터리 충전 장치 및 방법' -> 예시 출력: 배터리, 충전
