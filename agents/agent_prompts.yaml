# Agent 프롬프트 설정 파일
# 각 마스터그래프와 하위 에이전트의 용도, 기능, 분류 기준을 정의

supervisor:
  description: "최상위 오케스트레이터 - 사용자 요청을 분석하여 적절한 도메인으로 라우팅"
  architecture_features: |
    - Redis 기반 멀티턴 대화 지원: 모든 도메인에서 이전 대화 컨텍스트를 Redis에 저장하여 유지
    - Structured Output Parser: 사용자 쿼리에서 구조화된 파라미터를 추출하여 정확도 향상
    - Human-in-the-loop: 중요한 작업(연차 신청, 회의실 예약 등) 전 사용자 승인 요청
    - 서브그래프 구조: 각 도메인별 독립적인 에이전트와 워크플로우 관리
  classification_criteria: |
    사용자 질의를 분석하여 다음 도메인 중 하나로 분류:
    - schedule: 연차/반차/병가/경조사 신청, 회의실 예약, 일정 관리, 스케줄 조회 등 구체적인 액션 요청
    - document: 문서 작성, 보고서 작성, 템플릿 생성 등 문서 생성 관련
    - qa: Q&A, 질문, 문의, 메뉴얼, 복리후생 정책, 휴가규정, 근무제도, 급여 외 혜택, 회사 복지, 보험, 수당, 식단, 메뉴, 구내식당 관련
    - email: 이메일 검색, 이메일 답장문 생성 관련
    - tech: 특허, 논문, KISTI, ScienceON 관련

orchestrator:
  description: "오케스트레이터 프롬프트 설정 - 도메인 분류 및 이전 대화 확인 질문 분류"
  prompts:
    history_check:
      system_prompt: |
        사용자 질의를 분석하여 이전 대화 확인 질문인지 판단하세요.

        **이전 대화 확인 질문의 특징:**
        - 사용자가 과거에 요청한 작업이나 대화 내용을 확인하는 질문
        - 예: "내가 이메일에서 육아휴직 관련 내용 찾아달라는 요청을 한적이 있어?"
        - 예: "이전에 특허 검색 요청한 적 있어?"
        - 예: "내가 연차 신청한 적 있어?"
        - 예: "문서 작성 요청했던 적 있어?"

        **일반 질문과의 차이:**
        - 일반 질문: "이메일에서 육아휴직 관련 내용 찾아줘" (새로운 요청)
        - 확인 질문: "이메일에서 육아휴직 관련 내용 찾아달라고 요청한 적 있어?" (과거 요청 확인)

        **확인하려는 작업 유형:**
        - email_search: 이메일 검색 관련
        - patent_search: 특허 검색 관련
        - article_search: 논문 검색 관련
        - leave_request: 연차/휴가 신청 관련
        - document_generation: 문서 생성 관련
        - meeting_reservation: 회의실 예약 관련
        - 기타: 위에 해당하지 않는 경우

        {history_context}

        질의의 **주 목적**이 과거 요청이나 대화 내용을 확인하는 것인지 정확히 판단하세요.
      history_context_placeholder: "{history_context}"
    
    domain_classification:
      system_prompt: |
        사용자 질의를 분석하여 다음 도메인 중 하나로 분류하세요.

        **도메인 분류 기준 (문맥을 정확히 이해하여 분류하세요):**

        1. **email (이메일)**: 
           - "메일에서", "이메일에서", "메일함에서", "메일에서 찾아줘", "이메일 검색" 등의 표현이 포함된 경우
           - 이메일 검색, 이메일 답장문 생성 요청
           - **중요**: 질의에 "메일", "이메일", "메일함" 등의 키워드가 포함되어 있으면 반드시 email 도메인으로 분류하세요.

        2. **schedule (일정)**: 
           - 연차/반차/병가/경조사 신청, 회의실 예약, 일정 조회/관리
           - **주의**: "문서 검토 일정", "문서 확인 일정" 같이 "문서"라는 단어가 있어도 일정 조회가 주 목적이면 schedule로 분류

        3. **document (문서)**: 
           - 문서 작성, 보고서 작성, 템플릿 생성 요청
           - "문서 작성해줘", "보고서 작성", "양식:", "template:", "제품개발 계획서" 등
           - **중요**: "문서 작성해줘. 일정: ..." 같은 경우도 document로 분류 (문서 작성이 주 목적, 일정은 문서 내용의 일부)

        4. **qa (질문/문의)**: 
           - Q&A, 질문, 문의, 메뉴얼, 복리후생 정책 관련
           - **식단/메뉴 관련**: 식단 조회, 메뉴 조회, 구내식당, 점심/저녁 메뉴, 다이어트 식단, 식단 추천 등
           - 예: "오늘 식단 뭐야?", "내일 점심 메뉴 알려줘", "다이어트 중인데 내일 식단을 어떻게 먹어야해?", "구내식당 메뉴 조회"
           - **주의**: "메일에서", "이메일에서" 같은 표현이 있으면 qa가 아닌 email로 분류해야 합니다.
           - **주의**: "내일 식단"처럼 날짜가 포함되어 있어도 식단 조회가 주 목적이면 qa로 분류 (schedule이 아님)

        5. **tech (기술 검색)**: 
           - 특허, 논문, KISTI, ScienceON 관련 검색 요청

        **분류 예시:**
        - "문서 작성해줘. 양식: 제품개발 계획서. 일정: Q1, Q2 포함" → document (문서 작성이 주 목적)
        - "문서 검토 일정 알려줘" → schedule (일정 조회가 주 목적)
        - "문서 작성해줘. 문서 검토 일정도 포함해줘" → document (문서 작성이 주 목적)
        - "내일 연차 신청" → schedule (연차 신청)
        - "문서 목록 보여줘" → document (문서 조회)
        - "다이어트 중인데 내일 식단을 어떻게 먹어야해?" → qa (식단 조회가 주 목적, "내일"은 날짜 정보일 뿐)
        - "오늘 식단 뭐야?" → qa (식단 조회)
        - "내일 점심 메뉴 알려줘" → qa (식단 조회)
        - "구내식당 메뉴 조회" → qa (식단 조회)

        **분류 원칙:**
        - 질의의 **주 목적**을 파악하여 분류하세요
        - 키워드가 여러 개 있어도 주 목적이 무엇인지 판단하세요
        - 문맥을 고려하여 정확하게 분류하세요

        {context}
      context_placeholder: "{context}"
  important_rules:
    - '"이메일 자동응답", "메일 자동응답" 같은 이메일 답장문 생성은 email로 분류'
    - '"휴가·근무제도에 대해 알려줘", "급여 외 혜택에 대해 알려줘" 같은 정책/제도 질문은 qa로 분류'
    - '"이메일에서 ... 찾아줘", "메일에서 ... 찾아줘" 같은 이메일 검색은 email로 분류'
    - '숫자로 시작하는 질문은 이전 검색 결과의 상세 요청일 가능성이 높음 (이전 도메인 확인 필요)'
    - '"승인", "확인", "네", "예" 같은 단순 응답은 Human-in-the-loop 승인 요청에 대한 응답일 수 있음 (이전 도메인 확인 필요)'
    - '"웹 검색", "사내 검색" 같은 단순 응답은 이전 검색의 연속 요청일 수 있음 (이전 도메인 확인 필요)'
    - '명시적 키워드("논문", "특허", "메일" 등)가 있으면 이전 컨텍스트보다 우선하여 새로운 요청으로 처리'
  output_format: '{"route": "schedule|document|qa|email|tech|unknown"}'

schedule:
  description: "스케줄 도메인 - 연차/일정/회의 관리"
  features: |
    - Redis 기반 컨텍스트 관리: 이전 연차 조회, 신청 내역, 회의실 추천 결과 등을 Redis에 저장
    - Structured Output Parser: 연차 신청 시 날짜, 휴가 타입, 사유 등을 구조화된 형식으로 추출
    - Human-in-the-loop: 연차 신청 및 회의실 예약 시 사용자 승인 요청
  sub_agents:
    leave:
      description: "연차/반차/병가/경조사 관리"
      features: |
        - Structured Output Parser 사용: 사용자 쿼리에서 action, leave_type, start_date, end_date, total_days, reason 등을 자동 추출
        - Redis 컨텍스트: 이전 조회한 잔여 연차 정보, 신청 내역 등을 Redis에 저장하여 멀티턴 대화 지원
        - Human-in-the-loop: 연차 신청 시 날짜 정보가 있으면 사용자에게 승인 요청 (승인/취소 처리)
      capabilities:
        - "연차/반차/병가/경조사 조회"
        - "연차/반차/병가/경조사 신청 (승인 필요)"
        - "연차 잔여일 확인"
        - "연차 사용 내역 조회"
        - "연차 추천 날짜 조회"
      keywords:
        positive:
          - "연차"
          - "반차"
          - "병가"
          - "경조사"
          - "휴가"
          - "신청"
          - "잔여"
          - "남은"
          - "내역"
          - "목록"
        negative: []
      examples:
        - "내일 연차 신청하고 싶어"
        - "남은 연차 알려줘"
        - "연차 사용 내역 보여줘"
    schedule:
      description: "일정 관리 (일반 캘린더, 스케줄 조회/등록/취소)"
      features: |
        - Redis 컨텍스트: 이전 조회한 일정 필터, 검색 결과 등을 Redis에 저장하여 멀티턴 대화 지원
      capabilities:
        - "일정 조회"
        - "일정 등록"
        - "일정 취소"
        - "일정 알림"
        - "특정 날짜의 연차 사용자 조회"
      keywords:
        positive:
          - "일정"
          - "스케줄"
          - "캘린더"
          - "등록"
          - "취소"
          - "오늘"
          - "내일"
          - "이번 주"
        negative: []
      examples:
        - "오늘 일정 알려줘"
        - "다음 주 월요일 회의 일정 등록해줘"
        - "3월 15일 일정 취소해줘"
    meeting:
      description: "회의실 예약 및 회의 관리"
      features: |
        - Redis 컨텍스트: 추천된 회의실 목록, 예약 대기 정보 등을 Redis에 저장하여 멀티턴 대화 지원
        - Human-in-the-loop: 회의실 예약 요청 시 사용자에게 승인 요청 (승인/취소 처리)
      capabilities:
        - "회의실 조회"
        - "회의실 예약 (승인 필요)"
        - "회의실 취소"
        - "회의실 추천"
        - "예약 내역 조회"
      keywords:
        positive:
          - "회의실"
          - "회의"
          - "예약"
          - "방"
          - "회의실 예약"
          - "회의실 취소"
        negative: []
      examples:
        - "내일 오후 2시 회의실 예약해줘"
        - "10명 회의실 추천해줘"
        - "3층 회의실 예약 현황 알려줘"
        - "내일 사용가능한 회의실 알려줘"
        - "사용 가능한 회의실 추천해줘"
        - "빈 회의실 찾아줘"
  classification_criteria: |
    사용자 질의를 분석하여 다음 스케줄 서브 에이전트 중 하나로 분류:
    - leave: 연차, 반차, 병가, 경조사, 휴가 관련
    - meeting: 회의실 관련 (예약, 조회, 추천, 취소, 사용가능한 회의실 찾기 등)
      (중요: "회의실"이라는 키워드가 있으면 무조건 meeting으로 분류)
      (중요: "사용가능한 회의실", "사용 가능한 회의실", "빈 회의실", "회의실 추천" 등은 모두 meeting)
    - schedule: 일정, 캘린더, 스케줄 관련 (회의실이 아닌 일반 일정)
  output_format: '{"intent": "leave|meeting|schedule"}'

document:
  description: "문서 도메인 - 문서 작성/업로드/변환"
  features: |
    - Redis 기반 컨텍스트 관리: 생성한 문서 템플릿 타입, 변수 정보 등을 Redis에 저장
    - Structured Output Parser: 문서 생성 시 template_type, variables, output_format 등을 구조화된 형식으로 추출
  sub_agents:
    doc_generate:
      description: "문서 자동 작성"
      features: |
        - Structured Output Parser 사용: 사용자 쿼리에서 template_type, variables, output_format 등을 자동 추출
        - Redis 컨텍스트: 생성한 문서 정보를 Redis에 저장하여 멀티턴 대화 지원
          * 이전에 생성한 문서의 템플릿 타입, 제목, 변수 정보를 기억
          * 대화 히스토리를 활용하여 이전 요청에서 템플릿명, 제목, 요구사항 추출
          * "이전 문서와 같은 템플릿으로" 같은 요청 시 이전 컨텍스트 활용
      capabilities:
        - "템플릿 기반 문서 생성"
        - "인사정보 요약 리포트 작성"
        - "제품 비교표 생성"
        - "제품 개발 계획서 작성"
        - "구매 발주서 작성"
        - "월별 손익 분석 보고서 작성"
        - "활동 기준 원가 계산서 작성"
        - "근무 평가서 작성"
      templates:
        - "hr_summary_report"  # 인사정보 요약 리포트
        - "product_comparison"  # 제품 비교표
        - "product_development_plan"  # 제품 개발 계획서
        - "purchase_order"  # 구매 발주서
        - "monthly_profit_analysis"  # 월별 손익 분석
        - "activity_based_costing"  # 활동 기준 원가
        - "work_performance_review"  # 근무 평가서
      keywords:
        positive:
          - "문서"
          - "보고서"
          - "작성"
          - "템플릿"
          - "생성"
          - "만들어"
          - "계획서"
          - "리포트"
        negative:
          - "이메일 자동응답"  # 이건 email 도메인으로
          - "메일 자동응답"
      examples:
        - "2024년 1분기 인사정보 요약 리포트 작성해줘"
        - "스마트워치 신제품 개발 계획서 만들어줘"
        - "제품 비교표 템플릿 생성"
    update_document:
      description: "문서 업데이트 (복리후생/식단/메뉴얼)"
      features: |
        - Structured Output Parser 사용: 사용자 쿼리에서 document_title, file_path, document_type 등을 자동 추출
        - 업데이트 가능한 문서: 복리후생, 식단, 메뉴얼만 업데이트 가능
        - Redis 컨텍스트: 업데이트한 파일 경로, 청크 수 등을 Redis에 저장하여 멀티턴 대화 지원
        - 파일 파싱: PDF/DOCX 등의 파일에서 텍스트 추출
        - 청킹: 추출된 텍스트를 의미 있는 단위로 분할
        - 임베딩: 각 청크를 벡터로 변환
        - Vector DB Upsert: 임베딩 벡터를 Milvus에 저장/업데이트 (기존 문서 삭제 후 새로 저장)
      capabilities:
        - "복리후생 문서 업데이트"
        - "식단 문서 업데이트"
        - "메뉴얼 문서 업데이트"
        - "벡터 DB 업데이트"
      keywords:
        positive:
          - "업데이트"
          - "수정"
          - "갱신"
          - "변경"
          - "복리후생"
          - "식단"
          - "메뉴얼"
        negative: []
      examples:
        - "복리후생 문서를 업데이트해줘"
        - "식단 파일을 수정해줘"
        - "메뉴얼을 갱신해줘"
      structured_output_prompt: |
        사용자의 쿼리에서 문서 업데이트에 필요한 정보를 추출하세요.
        
        **업데이트 가능한 문서 타입:**
        - 복리후생: 회사 복리후생 정책, 휴가규정, 근무제도, 급여 외 혜택, 보험, 수당, 퇴직연금 등
        - 식단: 구내식당 식단, 점심/저녁 메뉴, 식단 추천 등
        - 메뉴얼: 시스템 사용 매뉴얼, Q&A, 사용 방법 안내 등
        
        **추출해야 할 정보:**
        - document_title (필수): 업데이트할 문서 제목. 반드시 "복리후생", "식단", "메뉴얼" 중 하나가 포함되어야 합니다.
        - file_path (선택): 업데이트할 파일 경로. 사용자가 명시적으로 파일 경로를 제공한 경우에만 추출합니다.
        - document_type (필수): 문서 타입. 반드시 "복리후생", "식단", "메뉴얼" 중 하나로 정확히 판단해야 합니다.
          * 쿼리에서 "복리후생", "휴가규정", "근무제도", "보험", "수당" 등의 키워드가 있으면 "복리후생"
          * 쿼리에서 "식단", "메뉴", "구내식당", "점심", "저녁" 등의 키워드가 있으면 "식단"
          * 쿼리에서 "메뉴얼", "매뉴얼", "사용 방법", "Q&A" 등의 키워드가 있으면 "메뉴얼"
          * 여러 키워드가 있으면 가장 많이 언급된 타입을 선택하거나, 쿼리의 주 목적을 파악하여 판단하세요.
        
        **주의사항:**
        - document_title은 반드시 포함되어야 하며, 업데이트 가능한 문서 타입 중 하나를 포함해야 합니다.
        - document_type은 반드시 "복리후생", "식단", "메뉴얼" 중 하나로 정확히 판단해야 합니다.
        - file_path는 선택적이지만, 사용자가 파일 경로를 언급한 경우 추출해야 합니다.
        - 사용자가 "복리후생", "식단", "메뉴얼" 중 하나를 언급하지 않으면 document_title과 document_type을 쿼리 내용을 분석하여 추론하세요.
      document_type_detection_keywords:
