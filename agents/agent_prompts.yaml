      * 예: "Python 개발자 인재 추천해줘", "이력서 검색해줘", "5년 경력 개발자 찾아줘"
    - summarize: 이전에 추천받은 인재 중 한 명을 선택하여 상세 요약 요청
      * **중요**: 숫자로 시작하거나 "번"이 포함된 요청은 이전 검색 결과의 상세 요청
      * 예: "1번 요약해줘", "2번 자세히", "3번 상세 정보", "1번 인재 알려줘"
      * 패턴: "숫자 + (번) + (요약/자세히/상세/알려줘/보여줘)" -> summarize
    
    **주의사항:**
    - 숫자로 시작하는 질문은 이전 검색 결과의 상세 요청일 가능성이 매우 높음
    - 예: "1번 요약해줘" -> summarize
    - 예: "2번 자세히 알려줘" -> summarize
    - 이전 검색 결과가 없으면 search로 분류하여 새로 검색 수행
  output_format: '{"intent": "search|summarize"}'

# ============================================================
# 오케스트레이터 설정
# ============================================================
orchestrator_config:
  date_time:
    weekday_names:
      - "월요일"
      - "화요일"
      - "수요일"
      - "목요일"
      - "금요일"
      - "토요일"
      - "일요일"
    date_format: "%Y년 %m월 %d일"
    time_format: "%H시 %M분"
  keywords:
    strong_history_keywords:
      - "요청한적"
      - "요청한 적"
      - "요청했어"
      - "요청했었어"
      - "요청한적있어"
      - "요청한 적 있어"
      - "한적"
      - "한 적"
      - "했어?"
      - "했었어?"
      - "했나?"
      - "했었나?"
      - "찾아달라고 요청"
      - "검색 요청한적"
      - "검색한적"
      - "검색한 적"
      - "찾아달라는 요청"
      - "요청했던"
      - "요청했었던"
      - "이전에"
      - "전에"
      - "아까"
      - "지금까지"
      - "지금껏"
    weak_history_keywords:
      - "했어"
      - "했나"
      - "했었어"
      - "했었나"
      - "했지"
      - "했었지"
    tech_continuation_keywords:
      - "웹에서"
      - "웹에서 검색"
      - "웹 검색"
      - "웹검색"
      - "사내 서버"
      - "사내 서버에서"
      - "사내 서버에서 검색"
      - "사내 검색"
      - "1"
      - "2"
      - "1번"
      - "2번"
      - "웹"
      - "사내"
    server_data_keywords:  # 특허 검색 관련 서버 데이터 질문 키워드
      - "서버에"
      - "서버에 데이터"
      - "데이터가 있나"
      - "데이터 있나"
      - "서버에 있나"
      - "서버에 있는지"
      - "데이터 있는지"
      - "서버"
      - "벡터"
      - "db"
      - "데이터베이스"
      - "밀버스"
  search_params:
    history_check_recent_messages: 3
    history_check_message_max_length: 200
    domain_classification_recent_messages: 2
    domain_classification_message_max_length: 100
    conversation_history_max_messages: 20  # 이전 대화 확인 시 검색할 최대 메시지 수
    email_results_max_count: 5
    query_preview_length: 50
    simple_selection_max_length: 3
    simple_selection_keywords:
      - "네"
      - "예"
      - "아니오"
      - "아니"
      - "1번"
      - "2번"
      - "1"
      - "2"
    # 이전 대화 확인 질문 처리용 키워드 매칭 설정
    history_check_matching:
      # 키워드 추출 패턴
      keyword_pattern: "([가-힣a-zA-Z]+)\\s*(?:관련|관해서|에 대해|에 대한|내용)"
      # 질문에서 직접 추출할 키워드 매핑
      query_keyword_mapping:
        email:
          - "이메일"
          - "메일"
        qa:
          - "식단"
          - "메뉴"
          - "구내식당"
        # QA 구체적 키워드 (복리후생, 연차사용 등)
        qa_specific:
          - "복리후생"
          - "연차사용"
          - "연차"
          - "휴가규정"
          - "근무제도"
          - "보험"
          - "수당"
          - "육아휴직"
          - "출산휴가"
          - "메뉴얼"
          - "매뉴얼"
          - "manual"
      # 이전 요청 타입별 검색 키워드
      request_type_keywords:
        email:
          search_verbs:
            - "찾아"
            - "검색"
            - "찾아줘"
            - "검색해줘"
        qa:
          keywords:
            - "식단"
            - "메뉴"
            - "구내식당"
            - "복리후생"
            - "연차사용"
            - "연차"
            - "휴가규정"
            - "근무제도"
            - "보험"
            - "수당"
            - "육아휴직"
            - "출산휴가"
      # 점수 계산 가중치
      scoring_weights:
        base_score: 10  # 기본 매칭 점수
        type_match_bonus: 20  # 타입 일치 보너스 (질문에서 "이메일" 언급 + 이전 요청도 이메일)
        keyword_match_bonus: 15  # 키워드 매칭 보너스 (질문의 키워드가 이전 요청에 포함)
        exact_keyword_match_bonus: 25  # 정확한 키워드 일치 보너스 (추출된 키워드가 질문 키워드와 정확히 일치)
        domain_type_match_bonus: 30  # 도메인 타입 일치 보너스 (질문의 도메인 타입과 이전 요청의 도메인 타입이 일치)
        all_keywords_match_multiplier: 2  # 모든 키워드 일치 보너스 배수 (exact_keyword_match_bonus * multiplier)
      # 키워드 매칭 설정
      keyword_matching:
        min_keyword_length: 2  # 키워드 최소 길이 (이 길이 이상인 키워드만 매칭에 사용)
        max_candidate_messages: 5  # 이전 답변 찾을 때 확인할 최대 메시지 수
        exclude_history_check_patterns:  # 이전 대화 확인 질문 패턴 (답변에서 제외)
          - "이전에"
          - "요청하신 적"
          - "요청한 적"
          - "한적이"
      # 정규식 패턴
      regex_patterns:
        email_doc_number: "\\d{11,}MAB\\d+-\\d+"  # 이메일 문서번호 패턴
        email_title: "\\*\\*\\[([^\\]]+)\\]\\*\\*"  # 이메일 제목 추출 패턴
      # 응답 메시지 설정
      response_messages:
        no_previous_request: "아니요, 이전에 {request_type} 요청은 없었습니다."
        no_email_search: "아니요, 이전에 이메일에서 검색/찾기 요청은 없었습니다."
        previous_qa_request: "네, 이전에 '{keywords}' 관련 내용을 요청하신 적이 있습니다."
        previous_email_request: "네, 이전에 '{keywords}' 관련 내용을 이메일에서 찾아달라는 요청을 하신 적이 있습니다."
        previous_generic_request: "네, 이전에 '{keywords}' 관련 요청을 하신 적이 있습니다."
        previous_generic_search: "네, 이전에 검색/찾기 요청을 하신 적이 있습니다."
        previous_qa_menu: "네, 이전에 식단/메뉴 관련 요청을 하신 적이 있습니다."
        previous_email_search: "네, 이전에 이메일에서 검색/찾기 요청을 하신 적이 있습니다."
        more_email_help: "\n더 많은 메일을 검색하거나 특정 메일의 상세 내용을 원하신다면 말씀해 주세요! 😊"
      # 체크 타입 매핑
      check_type_mapping:
        email_search: "이메일 검색"
        patent_search: "특허 검색"
        article_search: "논문 검색"
        leave_request: "연차/휴가 신청"
        document_generation: "문서 생성"
        meeting_reservation: "회의실 예약"
        recruitment_search: "인재 추천/이력서 검색"
    # Tech 도메인 관련 설정
    tech_domain:
      # 서버 데이터 질문 감지 키워드
      server_data_keywords:
        - "서버에"
        - "서버에 데이터"
        - "데이터가 있나"
        - "데이터 있나"
        - "서버에 있나"
        - "서버에 있는지"
        - "데이터 있는지"
        - "서버"
        - "벡터"
        - "db"
        - "데이터베이스"
        - "밀버스"
    # 라우팅 설정
    routing:
      # Fallback 도메인 설정
      fallback_domain: "qa"  # 알 수 없는 도메인일 때 기본 도메인
      fallback_domain_on_empty: "document"  # domain이 없을 때 기본 도메인
      # 도메인별 기본 완료 메시지
      domain_completion_messages:
        schedule: "스케줄 작업을 완료했습니다."
        document: "문서 작업을 완료했습니다."
        qa: "질문에 답변했습니다."
        email: "이메일 작업을 완료했습니다."
        tech: "기술 검색 작업을 완료했습니다."
        recruitment: "채용 작업을 완료했습니다."

# ============================================================
# QA Benefit Agent 설정
# ============================================================
qa_benefit:
  prompts:
    system_prompt: |
      당신은 회사의 복리후생(Benefits) 정책을 안내하는 전문 AI 어시스턴트입니다.
      제공된 복리후생 관련 문서를 기반으로 직원들의 복리후생 혜택, 휴가, 건강보험, 연금, 각종 보상 및 복지 제도에 대해 정확하고 상세한 답변을 제공하세요.
      답변할 때는 문서의 내용을 직접 인용하거나 참고하여 답변하며, 구체적인 절차, 자격요건, 신청방법 등을 명확히 안내하세요.
      만약 문서에 없는 내용이라면, 그렇다고 명확히 말씀해주세요.
      이전 대화 내용을 기억하고 자연스럽게 대화하듯이 답변하세요.
      주의: 답변에는 "[참고 문서]" 섹션을 포함하지 마세요. 답변 내용만 제공하세요.
    user_prompt: |
      다음은 회사의 복리후생 정책 문서에서 검색된 관련 내용입니다:

      {context}

      질문: {question}

      위 문서들을 참고하여 복리후생 관련 질문에 대한 상세하고 실용적인 답변을 한국어로 제공해주세요.
      답변에는 가능한 한 구체적인 절차, 자격요건, 신청방법, 문의처 등을 포함해주세요.
      이전 대화 내용이 있으면, 그것을 참고하여 자연스럽고 대화하듯이 답변하세요.
      주의: 답변 끝에 "[참고 문서]" 섹션을 추가하지 마세요.
  search_params:
    vector_search_limit: 15
    top_results_count: 7
    conversation_history_max_messages: 5
  hybrid_search:
    vector_weight: 0.6
    keyword_weight: 0.4

# ============================================================
# QA Cafeteria Agent 설정
# ============================================================
qa_cafeteria:
  prompts:
    system_prompt: |
      당신은 깐부전자의 직원 식단표를 안내하는 전문 AI 어시스턴트입니다.

      **현재 날짜와 시간: {current_date} ({current_weekday}) {current_time}**

      **날짜 계산 규칙:**
      - "오늘" → 현재 날짜 ({current_date})
      - "내일" → 현재 날짜 + 1일
      - "모레" → 현재 날짜 + 2일  
      - "내일 모레" → 현재 날짜 + 2일 (내일의 다음 날)
      - "다음주 [요일]" → 다음 주의 해당 요일
      - "이번주 [요일]" → 이번 주의 해당 요일

      제공된 식단표 데이터를 기반으로 직원들의 식단 관련 질문에 대해 정확하고 상세한 답변을 제공하세요.
      사용자가 "내일 모레", "다음주 월요일" 같은 상대적 날짜 표현을 사용하면, 위의 현재 날짜를 기준으로 정확한 날짜를 계산한 후 해당 날짜의 식단을 찾아 답변하세요.
      답변할 때는 식단표의 내용을 직접 참고하여 답변하며, 날짜, 요일, 메뉴, 칼로리 등의 정보를 명확히 안내하세요.
      식단표에 없는 내용이라면, 그렇다고 명확히 말씀해주세요.
      이전 대화 내용을 기억하고 자연스럽게 대화하듯이 답변하세요.
      답변은 친절하고 이해하기 쉽게 작성해주세요.
    user_prompt: |
      다음은 깐부전자의 직원 식단표 데이터에서 검색된 관련 내용입니다:

      {context}

      질문: {question}

      위 식단표 데이터를 참고하여 질문에 대한 상세하고 실용적인 답변을 한국어로 제공해주세요.
      답변에는 가능한 한 구체적인 날짜, 요일, 메뉴 정보, 칼로리 등을 포함해주세요.
      이전 대화 내용이 있으면, 그것을 참고하여 자연스럽고 대화하듯이 답변하세요.
  date_time:
    weekday_names:
      - "월요일"
      - "화요일"
      - "수요일"
      - "목요일"
      - "금요일"
      - "토요일"
      - "일요일"
    date_format: "%Y년 %m월 %d일"
    time_format: "%H시 %M분"

  search_params:
    vector_search_limit: 15  # .env의 VECTOR_SEARCH_LIMIT 사용 가능
    top_results_count: 7  # .env의 TOP_RESULTS_COUNT 사용 가능
    conversation_history_max_messages: 5
    retrieved_contexts_max_count: 3
    # Milvus 검색 파라미터 (.env 우선)
    milvus_metric_type: "L2"  # .env의 MILVUS_METRIC_TYPE 사용 가능
    milvus_nprobe: 10  # .env의 MILVUS_NPROBE 사용 가능
    # 키워드 추출 파라미터 (.env 우선)
    keyword_min_length: 2  # .env의 KEYWORD_MIN_LENGTH 사용 가능
    keyword_top_count: 10  # .env의 KEYWORD_TOP_COUNT 사용 가능
    # 키워드 점수 계산 가중치 (.env 우선)
    keyword_exact_match_score: 2.0  # .env의 KEYWORD_EXACT_MATCH_SCORE 사용 가능
    keyword_count_multiplier: 0.1  # .env의 KEYWORD_COUNT_MULTIPLIER 사용 가능
    keyword_substring_score: 0.1  # .env의 KEYWORD_SUBSTRING_SCORE 사용 가능
  hybrid_search:
    vector_weight: 0.6  # .env의 HYBRID_SEARCH_VECTOR_WEIGHT 사용 가능
    keyword_weight: 0.4  # .env의 HYBRID_SEARCH_KEYWORD_WEIGHT 사용 가능


