      description: "문서 업데이트 (복리후생/식단/메뉴얼/이력서)"
      features: |
        - Structured Output Parser 사용: 사용자 쿼리에서 document_title, file_path, document_type 등을 자동 추출
        - 업데이트 가능한 문서: 복리후생, 식단, 메뉴얼, 이력서
        - Redis 컨텍스트: 업데이트한 파일 경로, 청크 수 등을 Redis에 저장하여 멀티턴 대화 지원
        - 파일 파싱: PDF/DOCX 등의 파일에서 텍스트 추출
        - 청킹: 추출된 텍스트를 의미 있는 단위로 분할
        - 임베딩: 각 청크를 벡터로 변환
